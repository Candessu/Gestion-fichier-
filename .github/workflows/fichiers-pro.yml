              void openTile(Object[] t) {
                  Object k = t[3];
                  String title = (String) t[1];
                  prevDir = null;
                  if (k instanceof Integer) {
                      showCategory(title, (Integer) k);
                  } else if ("dl".equals(k)) {
                      File d = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                      if (!d.exists()) d.mkdirs();
                      browse(d, null);
                  } else if ("big".equals(k)) {
                      showCategory("Gros fichiers (> 10 Mo)", FileIndex.BIG);
                  } else {
                      showTrash();
                  }
              }

              // ---------------------------------------------------------------- navigation

              void browse(File dir, File focus) {
                  mode = M_BROWSE;
                  currentDir = dir;
                  selected.clear();
                  subText = dir.getAbsolutePath();
                  showListUi("", true, true);
                  buildCrumbs();
                  loadDir(dir, -1, focus);
