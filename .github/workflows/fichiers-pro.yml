                          .setPositiveButton("Restaurer", (d, w) -> restore(new ArrayList<>(Collections.singletonList(f))))
                          .setNeutralButton("Supprimer", (d, w) -> deletePermanent(new ArrayList<>(Collections.singletonList(f))))
                          .setNegativeButton("Fermer", null).show();
              }

              void restore(final ArrayList<File> fs) {
                  if (fs.isEmpty()) return;
                  runOp("Restauration…", op -> {
                      SharedPreferences.Editor ed = prefs.edit();
                      for (File f : fs) {
                          if (op.cancel) break;
                          String key = "tr:" + f.getName();
                          String orig = prefs.getString(key, null);
                          File target = orig != null ? new File(orig)
                                  : new File(new File(internalRoot(), "Restaurés"), f.getName().replaceFirst("^\\d+_\\d+_", ""));
                          File parent = target.getParentFile();
                          if (parent != null && !parent.exists()) parent.mkdirs();
                          if (target.exists()) target = uniqueDest(parent, target.getName());
                          op.current = target.getName();
                          if (f.renameTo(target)) ed.remove(key);
                          else op.errors++;
                      }
                      ed.apply();
                      op.msg = fs.size() + " élément(s) restauré(s)";
                  }, null);
              }

              void deletePermanent(final ArrayList<File> fs) {
                  if (fs.isEmpty()) return;
                  new AlertDialog.Builder(this).setTitle("Suppression définitive")
                          .setMessage("Supprimer définitivement " + fs.size() + " élément(s) ? Cette action est irréversible.")
                          .setPositiveButton("Supprimer", (d, w) -> runOp("Suppression…", op -> {
                              SharedPreferences.Editor ed = prefs.edit();
                              for (File f : fs) {
                                  if (op.cancel) break;
                                  op.current = f.getName();
                                  if (deleteRec(f)) ed.remove("tr:" + f.getName());
                                  else op.errors++;
                              }
                              ed.apply();
                              op.msg = fs.size() + " élément(s) supprimé(s)";
                          }, null))
                          .setNegativeButton("Annuler", null).show();
              }

