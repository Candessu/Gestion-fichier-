          package com.fichierspro.app;

          import java.text.Normalizer;
          import java.util.Locale;

          /** Normalisation pour la recherche : minuscules, sans accents (é è ê à â ç … -> e e e a a c). */
          final class Norm {
              private Norm() {
              }

              /** Minuscules et sans accents. */
              static String of(String s) {
                  return core(s, true);
              }

              /** Sans accents mais en gardant les majuscules (recherche sensible à la casse). */
              static String strip(String s) {
                  return core(s, false);
              }

              private static String core(String s, boolean low) {
                  int n = s.length();
                  boolean lower = true;
                  int i = 0;
                  for (; i < n; i++) {
                      char c = s.charAt(i);
                      if (c >= 128) break;
                      if (c >= 'A' && c <= 'Z') lower = false;
                  }
                  if (i == n) return (lower || !low) ? s : s.toLowerCase(Locale.ROOT);
                  String d = Normalizer.normalize(s, Normalizer.Form.NFKD);
                  StringBuilder b = new StringBuilder(d.length());
                  for (i = 0; i < d.length(); i++) {
                      char c = d.charAt(i);
                      int t = Character.getType(c);
                      if (t == Character.NON_SPACING_MARK || t == Character.ENCLOSING_MARK
                              || t == Character.COMBINING_SPACING_MARK) continue;
                      switch (c) {
                          case 'œ': b.append("oe"); break;
                          case 'Œ': b.append(low ? "oe" : "OE"); break;
                          case 'æ': b.append("ae"); break;
                          case 'Æ': b.append(low ? "ae" : "AE"); break;
                          case 'ß': b.append("ss"); break;
                          case 'ø': b.append('o'); break;
                          case 'Ø': b.append(low ? 'o' : 'O'); break;
                          case 'đ': b.append('d'); break;
                          case 'Đ': b.append(low ? 'd' : 'D'); break;
                          case 'ł': b.append('l'); break;
                          case 'Ł': b.append(low ? 'l' : 'L'); break;
                          default: b.append(low ? Character.toLowerCase(c) : c);
                      }
                  }
                  return b.toString();
              }
          }
