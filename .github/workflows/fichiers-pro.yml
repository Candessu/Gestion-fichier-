              // ---------------------------------------------------------------- cycle de vie

              @Override
              protected void onCreate(Bundle state) {
                  prefs = getSharedPreferences("fp", MODE_PRIVATE);
                  dark = prefs.getBoolean("dark", false);
                  setTheme(dark ? R.style.AppDark : R.style.AppTheme);
                  super.onCreate(state);
                  setupColors();
                  int max = (int) (Runtime.getRuntime().maxMemory() / 1024 / 8);
                  thumbs = new LruCache<String, Bitmap>(max) {
                      @Override
                      protected int sizeOf(String k, Bitmap b) {
                          return Math.max(1, b.getByteCount() / 1024);
                      }
                  };
                  getWindow().setStatusBarColor(darker(cPrimary));
                  getWindow().setNavigationBarColor(cCard);
                  buildUi();
                  loadSearchPrefs();
                  if (!hasPerm()) {
                      showPermScreen();
                      return;
                  }
                  ensureIndex();
                  String last = state != null ? state.getString("dir") : null;
                  if (last != null && new File(last).isDirectory()) browse(new File(last), null);
                  else showHome();
              }

              @Override
              protected void onSaveInstanceState(Bundle out) {
                  super.onSaveInstanceState(out);
                  if (mode == M_BROWSE && currentDir != null) out.putString("dir", currentDir.getAbsolutePath());
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if (waitingPerm && hasPerm()) {
                      waitingPerm = false;
                      showHome();
                  } else if (mode == M_BROWSE && selected.isEmpty()) {
                      loadDir(currentDir, listView.getFirstVisiblePosition(), null);
                  }
                  if (index != null && hasPerm()) index.syncIfStale(30000);
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  scanGen++;
                  searchGen.incrementAndGet();
                  ui.removeCallbacks(searchRun);
                  if (index != null && index.listener == indexListener) index.listener = null;
                  searchExec.shutdownNow();
                  bg.shutdownNow();
                  thumbExec.shutdownNow();
              }

              @Override
              public void onBackPressed() {
                  if (!selected.isEmpty()) {
                      selected.clear();
                      refreshSelectionUi();
                      return;
                  }
                  if (mode == M_BROWSE) {
                      if (back != null && (currentDir.equals(back.entry) || !inside(currentDir, back.entry))) {
                          restoreReturn();
                          return;
                      }
                      File r = rootOf(currentDir);
                      File parent = currentDir.getParentFile();
                      if (currentDir.equals(r) || parent == null) showHome();
                      else browse(parent, currentDir);
                      return;
                  }
                  if (mode == M_ANALYSIS) {
                      anaBack();
                      return;
                  }
                  if (mode == M_LIST && listBack != null) {
                      ReturnState st = listBack;
                      listBack = null;
                      restoreAna(st);
                      return;
                  }
                  if (mode == M_LIST || mode == M_TRASH || mode == M_SEARCH) {
                      hideKeyboard();
                      if (prevDir != null) {
                          File p = prevDir;
                          prevDir = null;
                          browse(p, null);
                      } else showHome();
                      return;
                  }
                  super.onBackPressed();
              }

