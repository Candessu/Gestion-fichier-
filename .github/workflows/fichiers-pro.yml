              static String ext(File f) {
                  String n = f.getName();
                  int i = n.lastIndexOf('.');
                  return i > 0 ? n.substring(i + 1).toLowerCase(Locale.ROOT) : "";
              }

              static String mimeOf(File f) {
                  String e = ext(f);
                  if (e.equals("apk")) return "application/vnd.android.package-archive";
                  String m = MimeTypeMap.getSingleton().getMimeTypeFromExtension(e);
                  return m != null ? m : "*/*";
              }

              static String fmtSize(long b) {
                  if (b < 1024) return b + " o";
                  String[] u = {"Ko", "Mo", "Go", "To"};
                  double v = b;
                  int i = -1;
                  do {
                      v /= 1024;
                      i++;
                  } while (v >= 1024 && i < u.length - 1);
                  return String.format(Locale.FRANCE, v < 10 ? "%.2f %s" : (v < 100 ? "%.1f %s" : "%.0f %s"), v, u[i]);
              }

              static String fmtDate(long t) {
                  return new SimpleDateFormat("dd/MM/yyyy HH:mm", Locale.FRANCE).format(new Date(t));
              }

              String displayName(File f) {
                  if (mode == M_TRASH) return f.getName().replaceFirst("^\\d+_\\d+_", "");
                  String n = f.getName();
                  return n.isEmpty() ? "/" : n;
              }

              String emoji(File f) {
                  if (f.isDirectory()) return "📁";
                  String e = ext(f);
                  if (IMG.contains(e)) return "🖼";
                  if (VID.contains(e)) return "🎬";
                  if (AUD.contains(e)) return "🎵";
                  if (e.equals("pdf")) return "📕";
                  if (e.startsWith("doc") || e.equals("odt") || e.equals("rtf")) return "📘";
                  if (e.startsWith("xls") || e.equals("csv") || e.equals("ods")) return "📗";
                  if (e.startsWith("ppt") || e.equals("odp")) return "📙";
                  if (APK.contains(e)) return "🤖";
                  if (ARC.contains(e)) return "🗜";
                  if (e.equals("html") || e.equals("htm")) return "🌐";
                  if (TXT.contains(e)) return "📝";
                  return "📄";
              }

              int typeColor(File f) {
                  if (f.isDirectory()) return 0xFFFFB300;
                  String e = ext(f);
                  if (IMG.contains(e)) return 0xFF43A047;
                  if (VID.contains(e)) return 0xFFE53935;
                  if (AUD.contains(e)) return 0xFF8E24AA;
                  if (APK.contains(e)) return 0xFF7CB342;
                  if (ARC.contains(e)) return 0xFF6D4C41;
                  if (DOC.contains(e)) return 0xFF1E88E5;
                  return 0xFF78909C;
              }

              static int soft(int c) {
                  return (c & 0x00FFFFFF) | 0x33000000;
              }

