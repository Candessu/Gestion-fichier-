          FIN_DU_FICHIER
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_fg.xml << 'FIN_DU_FICHIER'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <group android:scaleX="0.66" android:scaleY="0.66" android:translateX="-124.2" android:translateY="-8.04">
                  <path android:fillColor="#26C6DA" android:pathData="M238,50 h64 a6,6 0 0 1 6,6 v40 a6,6 0 0 1 -6,6 h-64 a6,6 0 0 1 -6,-6 v-40 a6,6 0 0 1 6,-6 z" />
                  <path android:fillColor="#FF7043" android:pathData="M232,64 h76 a6,6 0 0 1 6,6 v44 a6,6 0 0 1 -6,6 h-76 a6,6 0 0 1 -6,-6 v-44 a6,6 0 0 1 6,-6 z" />
                  <path android:fillColor="#FFCA28" android:pathData="M220,86 a6,6 0 0 1 6,-6 h22 l7,7 h53 a6,6 0 0 1 6,6 v38 a6,6 0 0 1 -6,6 h-82 a6,6 0 0 1 -6,-6 z" />
                  <path android:fillColor="#14213D" android:fillAlpha="0.35" android:pathData="M247,110 h46 a3,3 0 0 1 3,3 v0 a3,3 0 0 1 -3,3 h-46 a3,3 0 0 1 -3,-3 v-0 a3,3 0 0 1 3,-3 z" />
