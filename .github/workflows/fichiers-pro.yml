              void share(ArrayList<File> fs) {
                  ArrayList<Uri> us = new ArrayList<>();
                  File first = null;
                  for (File f : fs) {
                      if (f.isFile()) {
                          us.add(FilesProvider.uriFor(f));
                          if (first == null) first = f;
                      }
                  }
                  if (us.isEmpty()) {
                      toast("Les dossiers ne peuvent pas être partagés — compressez-les en ZIP");
                      return;
                  }
                  Intent i;
                  if (us.size() == 1) {
                      i = new Intent(Intent.ACTION_SEND);
                      i.setType(mimeOf(first));
                      i.putExtra(Intent.EXTRA_STREAM, us.get(0));
                  } else {
                      i = new Intent(Intent.ACTION_SEND_MULTIPLE);
                      i.setType("*/*");
                      i.putParcelableArrayListExtra(Intent.EXTRA_STREAM, us);
                  }
                  ClipData cd = ClipData.newRawUri("", us.get(0));
                  for (int k = 1; k < us.size(); k++) cd.addItem(new ClipData.Item(us.get(k)));
                  i.setClipData(cd);
                  i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                  try {
                      startActivity(Intent.createChooser(i, "Partager"));
                  } catch (Exception e) {
                      toast("Partage impossible");
                  }
              }

              // ---------------------------------------------------------------- ZIP

              void askZip(final ArrayList<File> fs) {
                  if (fs.isEmpty()) return;
                  final File dir = mode == M_BROWSE ? currentDir : fs.get(0).getParentFile();
                  String def = (fs.size() == 1 ? fs.get(0).getName().replaceFirst("\\.[^.]+$", "") : "archive") + ".zip";
                  inputDialog("Nom de l'archive ZIP", def, true, n -> {
                      final String name = n.toLowerCase(Locale.ROOT).endsWith(".zip") ? n : n + ".zip";
                      runOp("Compression…", op -> {
                          long tot = 0;
                          for (File f : fs) tot += sizeRec(f);
                          op.total = tot;
                          File z = uniqueDest(dir, name);
                          try (ZipOutputStream zos = new ZipOutputStream(new FileOutputStream(z))) {
                              for (File f : fs) {
                                  if (op.cancel) break;
                                  zipAdd(zos, f, f.getName(), op);
                              }
                          }
                          if (op.cancel) z.delete();
                          op.msg = "Archive créée : " + z.getName();
                      }, null);
                  });
              }

              void zipAdd(ZipOutputStream zos, File f, String path, Op op) throws IOException {
                  if (op.cancel) return;
                  if (f.isDirectory()) {
                      zos.putNextEntry(new ZipEntry(path + "/"));
                      zos.closeEntry();
                      File[] fs = f.listFiles();
                      if (fs != null) for (File c : fs) zipAdd(zos, c, path + "/" + c.getName(), op);
                  } else {
                      op.current = f.getName();
                      ZipEntry e = new ZipEntry(path);
                      e.setTime(f.lastModified());
                      zos.putNextEntry(e);
                      try (InputStream in = new FileInputStream(f)) {
                          byte[] buf = new byte[128 * 1024];
                          int n;
                          while ((n = in.read(buf)) > 0) {
                              if (op.cancel) break;
                              zos.write(buf, 0, n);
                              op.done += n;
                          }
                      } catch (IOException ex) {
                          op.errors++;
                      }
                      zos.closeEntry();
                  }
              }

              void zipDialog(final File f) {
                  final String base = f.getName().replaceFirst("(?i)\\.zip$", "");
                  String[] opts = {"📦  Extraire ici", "📁  Extraire dans « " + base + " »", "👁  Voir le contenu", "📂  Ouvrir avec…"};
                  new AlertDialog.Builder(this).setTitle(f.getName()).setItems(opts, (d, w) -> {
                      File parent = f.getParentFile();
                      if (w == 0) extract(f, parent);
                      else if (w == 1) extract(f, uniqueDest(parent, base));
                      else if (w == 2) zipContents(f);
                      else openWith(f, true);
                  }).show();
              }

              void zipContents(final File f) {
                  bg.execute(() -> {
                      final StringBuilder sb = new StringBuilder();
                      int n = 0;
                      long tot = 0;
                      try (ZipFile zf = new ZipFile(f)) {
                          Enumeration<? extends ZipEntry> en = zf.entries();
                          while (en.hasMoreElements()) {
                              ZipEntry e = en.nextElement();
                              n++;
                              if (e.getSize() > 0) tot += e.getSize();
                              if (n <= 500) sb.append(e.isDirectory() ? "📁 " : "📄 ").append(e.getName())
                                      .append(e.isDirectory() ? "" : "  (" + fmtSize(Math.max(0, e.getSize())) + ")").append('\n');
                          }
                          if (n > 500) sb.append("… et ").append(n - 500).append(" autres");
                          sb.insert(0, n + " élément(s) — " + fmtSize(tot) + " décompressés\n\n");
                      } catch (Exception ex) {
                          sb.append("Archive illisible : ").append(ex.getMessage());
                      }
                      ui.post(() -> {
                          if (isFinishing()) return;
                          ScrollView sv = new ScrollView(this);
                          TextView tv = text(sb.toString(), 13, cText, false);
                          tv.setPadding(dp(22), dp(10), dp(22), dp(10));
                          tv.setTextIsSelectable(true);
                          sv.addView(tv);
                          new AlertDialog.Builder(this).setTitle(f.getName()).setView(sv)
                                  .setPositiveButton("Fermer", null).show();
                      });
                  });
              }

              void extract(final File zip, final File dest) {
                  runOp("Extraction…", op -> {
                      if (!dest.exists()) dest.mkdirs();
                      String canon = dest.getCanonicalPath() + File.separator;
                      try (ZipFile zf = new ZipFile(zip)) {
                          long tot = 0;
                          Enumeration<? extends ZipEntry> en = zf.entries();
                          while (en.hasMoreElements()) {
                              long s = en.nextElement().getSize();
                              if (s > 0) tot += s;
                          }
                          op.total = tot;
                          en = zf.entries();
                          byte[] buf = new byte[128 * 1024];
                          while (en.hasMoreElements()) {
                              if (op.cancel) break;
                              ZipEntry e = en.nextElement();
                              File out = new File(dest, e.getName());
                              if (!out.getCanonicalPath().startsWith(canon)) {
                                  op.errors++;
                                  continue;
                              }
                              if (e.isDirectory()) {
                                  out.mkdirs();
                                  continue;
                              }
                              File p = out.getParentFile();
                              if (p != null) p.mkdirs();
                              op.current = e.getName();
                              try (InputStream in = zf.getInputStream(e); OutputStream o = new FileOutputStream(out)) {
                                  int n;
                                  while ((n = in.read(buf)) > 0) {
                                      if (op.cancel) break;
                                      o.write(buf, 0, n);
                                      op.done += n;
                                  }
                              } catch (IOException ex) {
                                  op.errors++;
                              }
                              if (e.getTime() > 0) out.setLastModified(e.getTime());
                          }
                      }
                      op.msg = "Extraction terminée dans « " + dest.getName() + " »";
                  }, op -> {
                      if (!op.cancel && mode == M_BROWSE && !dest.equals(currentDir)) browse(dest, null);
                  });
              }

              // ---------------------------------------------------------------- propriétés

              void properties(final ArrayList<File> fs) {
                  if (fs.isEmpty()) return;
                  final TextView tv = text("", 14, cText, false);
                  tv.setPadding(dp(22), dp(12), dp(22), dp(8));
                  tv.setTextIsSelectable(true);
                  tv.setLineSpacing(0, 1.2f);
                  final File one = fs.size() == 1 ? fs.get(0) : null;
                  final StringBuilder head = new StringBuilder();
                  if (one != null) {
                      head.append("Nom : ").append(displayName(one)).append('\n');
                      head.append("Emplacement : ").append(one.getParent()).append('\n');
                      head.append("Type : ").append(one.isDirectory() ? "Dossier" : ext(one).toUpperCase(Locale.ROOT) + " (" + mimeOf(one) + ")").append('\n');
                      head.append("Modifié : ").append(fmtDate(one.lastModified())).append('\n');
                      head.append("Lecture : ").append(one.canRead() ? "oui" : "non")
                              .append("   Écriture : ").append(one.canWrite() ? "oui" : "non")
                              .append("   Caché : ").append(one.getName().startsWith(".") ? "oui" : "non").append('\n');
                  } else {
                      head.append(fs.size()).append(" éléments sélectionnés\n");
                  }
                  tv.setText(head + "Taille : calcul…");
                  ScrollView sv = new ScrollView(this);
                  sv.addView(tv);
                  AlertDialog.Builder b = new AlertDialog.Builder(this).setTitle(one != null ? "Propriétés" : "Propriétés de la sélection")
                          .setView(sv).setPositiveButton("OK", null);
                  if (one != null && one.isFile()) b.setNeutralButton("Calculer MD5", (d, w) -> md5(one));
                  b.show();
                  bg.execute(() -> {
                      long size = 0;
                      int files = 0, dirs = 0;
                      ArrayDeque<File> st = new ArrayDeque<>();
                      for (File f : fs) {
                          if (f.isDirectory()) {
                              dirs++;
                              st.push(f);
                          } else {
                              files++;
                              size += f.length();
                          }
                      }
                      while (!st.isEmpty()) {
                          File[] cs = st.pop().listFiles();
                          if (cs == null) continue;
                          for (File c : cs) {
                              if (c.isDirectory()) {
                                  dirs++;
                                  st.push(c);
                              } else {
                                  files++;
                                  size += c.length();
                              }
                          }
                      }
                      final String s = head + "Taille : " + fmtSize(size) + "  (" + String.format(Locale.FRANCE, "%,d", size) + " octets)\n"
                              + "Contenu : " + files + " fichier(s), " + (one != null && one.isDirectory() ? dirs - 1 : dirs) + " dossier(s)";
                      ui.post(() -> tv.setText(s));
                  });
              }

              void md5(final File f) {
                  final String[] result = new String[1];
                  runOp("Calcul MD5…", op -> {
                      op.total = f.length();
                      op.current = f.getName();
                      MessageDigest md = MessageDigest.getInstance("MD5");
                      try (InputStream in = new FileInputStream(f)) {
                          byte[] buf = new byte[256 * 1024];
                          int n;
                          while ((n = in.read(buf)) > 0) {
                              if (op.cancel) return;
                              md.update(buf, 0, n);
                              op.done += n;
                          }
                      }
                      StringBuilder sb = new StringBuilder();
                      for (byte x : md.digest()) sb.append(String.format("%02x", x));
                      result[0] = sb.toString();
                  }, op -> {
                      if (result[0] == null) return;
                      TextView tv = text(f.getName() + "\n\nMD5 :\n" + result[0], 14, cText, false);
                      tv.setTextIsSelectable(true);
                      tv.setPadding(dp(22), dp(12), dp(22), dp(8));
                      new AlertDialog.Builder(this).setTitle("Empreinte MD5").setView(tv)
                              .setPositiveButton("Copier", (d, w) -> {
                                  ClipboardManager cm = (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                                  cm.setPrimaryClip(ClipData.newPlainText("md5", result[0]));
                                  toast("MD5 copié");
                              }).setNegativeButton("Fermer", null).show();
                  });
              }

              // ---------------------------------------------------------------- miniatures

              @SuppressWarnings("deprecation")
              void loadThumb(final String key, final ImageView iv, final boolean video) {
                  if (thumbFailed.contains(key) || !thumbPending.add(key)) return;
                  thumbExec.execute(() -> {
                      Bitmap b = null;
                      try {
                          if (video) {
                              b = ThumbnailUtils.createVideoThumbnail(key, MediaStore.Images.Thumbnails.MINI_KIND);
                              if (b != null) {
                                  Bitmap s = ThumbnailUtils.extractThumbnail(b, 144, 144);
                                  if (s != b) b.recycle();
                                  b = s;
                              }
                          } else {
                              BitmapFactory.Options o = new BitmapFactory.Options();
                              o.inJustDecodeBounds = true;
                              BitmapFactory.decodeFile(key, o);
                              int s = 1;
                              while (o.outWidth / (s * 2) >= 144 && o.outHeight / (s * 2) >= 144) s *= 2;
                              BitmapFactory.Options o2 = new BitmapFactory.Options();
                              o2.inSampleSize = s;
                              b = BitmapFactory.decodeFile(key, o2);
                          }
                      } catch (Throwable ignored) {
                      }
                      thumbPending.remove(key);
                      if (b == null) {
                          thumbFailed.add(key);
                          return;
                      }
                      final Bitmap fb = b;
                      thumbs.put(key, fb);
                      ui.post(() -> {
                          if (key.equals(iv.getTag())) {
                              iv.setImageBitmap(fb);
                              iv.setVisibility(View.VISIBLE);
                          }
                      });
                  });
              }

              // ---------------------------------------------------------------- adaptateur

              // ---------------------------------------------------------------- analyse du stockage (tout sur un écran)

              static final int[] CAT_COLORS = {0, 0xFF43A047, 0xFFE53935, 0xFF8E24AA, 0xFF1E88E5, 0xFF7CB342, 0xFFF9A825, 0xFF90A4AE};
              static final String[] CAT_NAMES = {"", "Images", "Vidéos", "Audio", "Documents", "APK", "Archives", "Autres fichiers"};

              File anaDir, anaRoot, anaReturn;
              ScrollView anaScroll;
              LinearLayout anaCol;
              long anaLastLoad;
              final HashMap<String, Integer> anaScrollMem = new HashMap<>();

              static final class AnaData {
                  long total, free;
                  long[][] cats;
                  ArrayList<FileIndex.Child> kids;
                  ArrayList<IFile> big;
                  long[] bigStats;
                  long trash, dirTotal, dirCount;
              }

              /** Point d'entrée : un appui sur le pourcentage de stockage. */
              void showAnalysis(File dir, File returnTo) {
                  ensureIndex();
                  back = null;
                  listBack = null;
                  anaRoot = rootOf(dir);
                  anaReturn = returnTo;
                  anaScrollMem.clear();
                  showAnalysisDir(dir, 0);
              }

              void showAnalysisDir(File dir, int scrollY) {
                  mode = M_ANALYSIS;
                  anaDir = dir;
                  selected.clear();
                  scanGen++;
                  boolean root = dir.equals(anaRoot);
                  listTitle = root ? "Analyse du stockage" : dir.getName();
                  subText = root ? (anaRoot.equals(internalRoot()) ? "Stockage interne" : "Carte SD / USB") : "Calcul…";
                  btnBack.setVisibility(View.VISIBLE);
                  crumbScroll.setVisibility(View.VISIBLE);
                  buildAnaCrumbs();
                  anaScroll = new ScrollView(this);
                  anaCol = new LinearLayout(this);
                  anaCol.setOrientation(LinearLayout.VERTICAL);
                  anaCol.setPadding(dp(12), dp(12), dp(12), dp(28));
                  anaScroll.addView(anaCol);
                  content.removeAllViews();
                  content.addView(anaScroll, new FrameLayout.LayoutParams(-1, -1));
                  ProgressBar pb = new ProgressBar(this);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(dp(44), dp(44));
                  lp.gravity = Gravity.CENTER_HORIZONTAL;
                  lp.topMargin = dp(60);
                  anaCol.addView(pb, lp);
                  updateHeader();
                  loadAnalysis(scrollY);
              }

              void buildAnaCrumbs() {
                  crumbs.removeAllViews();
                  ArrayList<File> chain = new ArrayList<>();
                  for (File f = anaDir; f != null; f = f.getParentFile()) {
                      chain.add(0, f);
                      if (f.equals(anaRoot)) break;
                  }
                  for (int i = 0; i < chain.size(); i++) {
                      final File f = chain.get(i);
                      boolean last = i == chain.size() - 1;
                      String name = i == 0 ? (f.equals(internalRoot()) ? "📊 Interne" : "📊 " + f.getName()) : f.getName();
                      TextView t = text(name, 13, last ? hi() : cSub, last);
                      t.setPadding(dp(8), dp(6), dp(8), dp(6));
                      t.setBackground(ripple(false));
                      t.setOnClickListener(v -> {
                          if (!f.equals(anaDir)) showAnalysisDir(f, memScroll(f));
                      });
                      crumbs.addView(t);
                      if (!last) crumbs.addView(text("›", 15, cSub, false));
                  }
                  crumbScroll.post(() -> crumbScroll.fullScroll(View.FOCUS_RIGHT));
              }

              int memScroll(File f) {
                  Integer y = anaScrollMem.get(f.getAbsolutePath());
                  return y == null ? 0 : y;
              }

              void anaInto(File child) {
                  if (anaScroll != null) anaScrollMem.put(anaDir.getAbsolutePath(), anaScroll.getScrollY());
                  showAnalysisDir(child, 0);
              }

              void anaBack() {
                  if (anaDir != null && !anaDir.equals(anaRoot) && anaDir.getParentFile() != null) {
                      File p = anaDir.getParentFile();
                      showAnalysisDir(p, memScroll(p));
                  } else if (anaReturn != null) {
                      File r = anaReturn;
                      anaReturn = null;
                      browse(r, null);
                  } else showHome();
              }

              void loadAnalysis(final int restoreY) {
                  final int gen = ++scanGen;
                  final File dir = anaDir;
                  final String scope = dir.getAbsolutePath();
                  final boolean root = dir.equals(anaRoot);
                  final boolean hidden = showHidden();
                  final boolean internal = anaRoot.equals(internalRoot());
                  anaLastLoad = SystemClock.uptimeMillis();
                  bg.execute(() -> {
                      final AnaData d = new AnaData();
                      try {
                          StatFs s = new StatFs(anaRoot.getPath());
                          d.total = s.getTotalBytes();
                          d.free = s.getAvailableBytes();
                      } catch (Exception ignored) {
                      }
                      d.cats = index.allStats(hidden, scope);
                      d.kids = index.childSizes(scope);
                      d.big = index.list(FileIndex.BIG, hidden, 3, 0, scope);
                      d.bigStats = d.cats[0];
                      for (FileIndex.Child c : d.kids) {
                          d.dirTotal += c.size;
                          d.dirCount += c.count;
                      }
                      if (root && internal) d.trash = sizeRec(trashDir());
                      ui.post(() -> {
                          if (gen != scanGen || mode != M_ANALYSIS || !dir.equals(anaDir)) return;
                          renderAnalysis(d, root);
                          anaScroll.post(() -> anaScroll.scrollTo(0, restoreY));
                      });
                  });
              }

              LinearLayout anaCard() {
                  LinearLayout c = new LinearLayout(this);
                  c.setOrientation(LinearLayout.VERTICAL);
                  c.setBackground(round(cCard, 18));
                  c.setElevation(dp(1));
                  c.setClipToOutline(true);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(-1, -2);
                  lp.setMargins(0, 0, 0, dp(12));
                  c.setLayoutParams(lp);
