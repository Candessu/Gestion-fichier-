              static ArrayList<Entry> list(String dir) {
                  ArrayList<Entry> out = new ArrayList<>();
                  try (DirectoryStream<Path> ds = Files.newDirectoryStream(Paths.get(dir))) {
                      for (Path p : ds) {
                          try {
                              BasicFileAttributes a = Files.readAttributes(p, BasicFileAttributes.class, LinkOption.NOFOLLOW_LINKS);
                              if (a.isSymbolicLink()) continue;
                              boolean d = a.isDirectory();
                              if (!d && !a.isRegularFile()) continue;
                              Path fn = p.getFileName();
                              if (fn == null) continue;
                              Entry e = new Entry();
                              e.name = fn.toString();
                              e.dir = d;
                              e.size = d ? 0 : a.size();
                              e.mtime = a.lastModifiedTime().toMillis();
                              out.add(e);
