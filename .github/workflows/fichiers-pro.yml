              void searchOptsChanged() {
                  prefs.edit().putBoolean("o_case", iopts.caseSens).putBoolean("o_word", iopts.wholeWord)
                          .putBoolean("o_path", iopts.path).putBoolean("o_acc", iopts.diacritics)
                          .putBoolean("o_regex", iopts.regex).putInt("o_type", iopts.type).putInt("o_sort", iopts.sort).apply();
