                  else s.remove(f.getAbsolutePath());
                  prefs.edit().putStringSet("fav", s).apply();
                  toast(on ? "Ajouté aux favoris" : "Retiré des favoris");
              }

              List<String> recents() {
                  String r = prefs.getString("rec", "");
                  ArrayList<String> out = new ArrayList<>();
                  for (String s : r.split("\n")) if (!s.isEmpty()) out.add(s);
                  return out;
              }

              void addRecent(File f) {
                  List<String> r = recents();
                  r.remove(f.getAbsolutePath());
                  r.add(0, f.getAbsolutePath());
                  while (r.size() > 15) r.remove(r.size() - 1);
                  prefs.edit().putString("rec", TextUtils.join("\n", r)).apply();
              }

              // ---------------------------------------------------------------- stockage

              File internalRoot() {
                  return Environment.getExternalStorageDirectory();
              }

              File trashDir() {
                  return new File(internalRoot(), ".CorbeilleFichiersPro");
              }

              List<File> storageRoots() {
                  ArrayList<File> out = new ArrayList<>();
                  out.add(internalRoot());
                  File[] dirs = getExternalFilesDirs(null);
                  if (dirs != null) {
                      for (int i = 1; i < dirs.length; i++) {
                          if (dirs[i] == null) continue;
                          String p = dirs[i].getAbsolutePath();
                          int k = p.indexOf("/Android/data");
                          if (k > 0) {
                              File r = new File(p.substring(0, k));
                              if (!out.contains(r)) out.add(r);
                          }
                      }
                  }
                  return out;
              }

              File rootOf(File f) {
                  String p = f.getAbsolutePath();
                  for (File r : storageRoots()) {
                      String rp = r.getAbsolutePath();
                      if (p.equals(rp) || p.startsWith(rp + "/")) return r;
                  }
                  return new File("/");
              }

              // ---------------------------------------------------------------- permission

              boolean hasPerm() {
                  if (Build.VERSION.SDK_INT >= 30) return Environment.isExternalStorageManager();
                  return checkSelfPermission(Manifest.permission.WRITE_EXTERNAL_STORAGE) == PackageManager.PERMISSION_GRANTED;
              }

              void requestPerm() {
                  if (Build.VERSION.SDK_INT >= 30) {
                      waitingPerm = true;
                      try {
                          Intent i = new Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION);
                          i.setData(Uri.parse("package:" + getPackageName()));
                          startActivity(i);
                      } catch (Exception e) {
                          startActivity(new Intent(Settings.ACTION_MANAGE_ALL_FILES_ACCESS_PERMISSION));
                      }
                  } else {
                      requestPermissions(new String[]{Manifest.permission.READ_EXTERNAL_STORAGE,
                              Manifest.permission.WRITE_EXTERNAL_STORAGE}, 7);
                  }
              }

              @Override
              public void onRequestPermissionsResult(int code, String[] p, int[] r) {
                  super.onRequestPermissionsResult(code, p, r);
                  if (hasPerm()) showHome();
                  else toast("Permission refusée");
              }

