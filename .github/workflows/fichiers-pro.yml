          package com.fichierspro.app;

          import java.util.ArrayList;
          import java.util.Arrays;
          import java.util.concurrent.atomic.AtomicInteger;

          /**
           * Moteur de recherche en mémoire : insensible à la casse et aux accents,
           * résultats classés du plus proche au plus éloigné, tolérant aux fautes de frappe.
           */
          final class SearchEngine {
              private SearchEngine() {
              }

              static final int F_DIR = 1, F_HIDDEN = 2;

              /** Instantané compact de l'index (tableaux parallèles). */
              static final class Snapshot {
                  long version;
                  int n;
                  String[] dirs;
                  int[] parent;
                  String[] name;
                  String[] norm;
                  long[] size;
                  long[] mtime;
                  byte[] flags;
                  byte[] type;
                  int[] byName;
                  String[] stripCase, lowerAcc;

                  String path(int i) {
                      String d = dirs[parent[i]];
                      return d.endsWith("/") ? d + name[i] : d + "/" + name[i];
                  }
              }

              static final class Result {
                  int[] idx = new int[0];
                  int total;
                  boolean fuzzy;
              }

              static String[] tokens(String normQuery) {
                  String q = normQuery.trim();
                  if (q.isEmpty()) return new String[0];
                  return q.split("\\s+");
              }

              private static boolean alnum(char c) {
                  return Character.isLetterOrDigit(c);
              }

              /** Score strict d'un mot de la requête dans un nom normalisé (0 = pas trouvé). */
              static int strict(String norm, String t) {
                  int idx = norm.indexOf(t);
                  if (idx < 0) return 0;
                  int nl = norm.length(), tl = t.length();
                  if (nl == tl) return 1000;
                  int dot = norm.lastIndexOf('.');
                  if (idx == 0 && dot == tl) return 1000;
                  int lenPen = Math.min((nl - tl) / 2, 40);
                  if (idx == 0) return 850 - lenPen;
                  int i = idx;
                  while (i >= 0) {
                      if (!alnum(norm.charAt(i - 1))) return 700 - Math.min(i, 50) - lenPen;
                      i = norm.indexOf(t, i + 1);
                      if (i <= 0) break;
                  }
                  return 500 - Math.min(idx, 50) - lenPen;
              }

              /** Distance de Damerau-Levenshtein bornée (retourne max+1 si dépassée). */
              static int editDistance(String a, int a0, int al, String b, int b0, int bl, int max, int[][] buf) {
                  if (Math.abs(al - bl) > max) return max + 1;
                  int[] p2 = buf[0], p1 = buf[1], cur = buf[2];
                  for (int j = 0; j <= bl; j++) p1[j] = j;
                  for (int i = 1; i <= al; i++) {
                      cur[0] = i;
                      int best = cur[0];
                      char ca = a.charAt(a0 + i - 1);
                      for (int j = 1; j <= bl; j++) {
                          char cb = b.charAt(b0 + j - 1);
                          int c = ca == cb ? 0 : 1;
                          int v = Math.min(Math.min(cur[j - 1] + 1, p1[j] + 1), p1[j - 1] + c);
                          if (i > 1 && j > 1 && ca == b.charAt(b0 + j - 2) && a.charAt(a0 + i - 2) == cb)
                              v = Math.min(v, p2[j - 2] + 1);
                          cur[j] = v;
                          if (v < best) best = v;
                      }
                      if (best > max) return max + 1;
                      int[] tmp = p2;
                      p2 = p1;
                      p1 = cur;
                      cur = tmp;
                  }
                  return p1[bl];
              }

              /** Score approximatif : fautes de frappe sur un mot du nom, ou lettres dans l'ordre. */
              static int loose(String norm, String t, int[][] buf) {
                  int tl = t.length();
                  int max = tl <= 3 ? 0 : (tl <= 6 ? 1 : 2);
                  int best = 0;
                  if (max > 0) {
                      int n = norm.length(), i = 0;
                      while (i < n) {
                          while (i < n && !alnum(norm.charAt(i))) i++;
                          int s = i;
                          while (i < n && alnum(norm.charAt(i))) i++;
                          int wl = i - s;
                          if (wl == 0 || wl > 60 || tl > 60) continue;
                          int d = editDistance(t, 0, tl, norm, s, wl, max, buf);
                          if (d <= max) best = Math.max(best, 400 - 80 * d);
                          else if (wl > tl) {
                              int pl = Math.min(wl, tl + 1);
                              d = Math.min(editDistance(t, 0, tl, norm, s, tl, max, buf),
                                      editDistance(t, 0, tl, norm, s, pl, max, buf));
                              if (d <= max) best = Math.max(best, 370 - 80 * d);
                          }
                      }
                  }
                  if (best == 0 && tl >= 3) {
                      int n = norm.length(), j = 0, first = -1, last = -1;
                      for (int i = 0; i < n && j < tl; i++) {
                          if (norm.charAt(i) == t.charAt(j)) {
                              if (j == 0) first = i;
                              last = i;
                              j++;
                          }
                      }
                      if (j == tl) {
                          int span = last - first + 1;
                          if (span <= tl * 2 + 1) best = 190 - Math.min(150, (span - tl) * 12) - Math.min(first, 20);
                      }
                  }
                  return best;
              }

              private static int scoreStrict(String norm, String phrase, String[] toks) {
                  if (toks.length == 1) return strict(norm, toks[0]);
                  int p = strict(norm, phrase);
                  if (p > 0) return Math.min(1000, p + 20);
                  int sum = 0;
                  for (String t : toks) {
                      int s = strict(norm, t);
                      if (s == 0) return 0;
                      sum += s;
                  }
                  return sum / toks.length * 9 / 10;
              }

              private static int scoreLoose(String norm, String[] toks, int[][] buf) {
                  int sum = 0;
                  for (String t : toks) {
                      int s = strict(norm, t);
                      if (s == 0) s = loose(norm, t, buf);
                      if (s == 0) return 0;
                      sum += Math.min(s, 450);
                  }
                  return sum / toks.length * 8 / 10;
              }

              static Result search(Snapshot sn, String rawQuery, String scopeDir, boolean showHidden, int limit,
                                   boolean allowLoose, AtomicInteger gen, int myGen) {
                  Result res = new Result();
                  String phrase = Norm.of(rawQuery).trim().replaceAll("\\s+", " ");
                  String[] toks = tokens(phrase);
                  if (toks.length == 0 || sn == null || sn.n == 0) return res;
                  boolean[] dirOk = null;
                  if (scopeDir != null) {
                      dirOk = new boolean[sn.dirs.length];
                      String pre = scopeDir.endsWith("/") ? scopeDir : scopeDir + "/";
                      for (int d = 0; d < dirOk.length; d++)
                          dirOk[d] = sn.dirs[d].equals(scopeDir) || sn.dirs[d].startsWith(pre);
                  }
                  int n = sn.n;
                  long[] keys = new long[1024];
                  int k = 0;
                  boolean[] hit = new boolean[n];
                  for (int i = 0; i < n; i++) {
                      if ((i & 4095) == 0 && gen != null && gen.get() != myGen) return null;
                      byte fl = sn.flags[i];
                      if (!showHidden && (fl & F_HIDDEN) != 0) continue;
                      if (dirOk != null && !dirOk[sn.parent[i]]) continue;
                      int s = scoreStrict(sn.norm[i], phrase, toks);
                      if (s <= 0) continue;
                      hit[i] = true;
                      if ((fl & F_DIR) != 0) s += 15;
                      if (k == keys.length) keys = Arrays.copyOf(keys, k * 2);
                      keys[k++] = key(s, sn.norm[i].length(), i);
                  }
                  if (allowLoose && k < 25) {
                      int[][] buf = new int[3][64];
                      for (int i = 0; i < n; i++) {
                          if ((i & 1023) == 0 && gen != null && gen.get() != myGen) return null;
                          if (hit[i]) continue;
                          byte fl = sn.flags[i];
                          if (!showHidden && (fl & F_HIDDEN) != 0) continue;
                          if (dirOk != null && !dirOk[sn.parent[i]]) continue;
                          int s = scoreLoose(sn.norm[i], toks, buf);
                          if (s <= 0) continue;
                          res.fuzzy = true;
                          if (k == keys.length) keys = Arrays.copyOf(keys, k * 2);
                          keys[k++] = key(s, sn.norm[i].length(), i);
                      }
                  }
                  Arrays.sort(keys, 0, k);
                  res.total = k;
                  int m = Math.min(k, limit);
                  res.idx = new int[m];
                  for (int i = 0; i < m; i++) res.idx[i] = (int) (keys[i] & 0x3FFFFFFFL);
                  return res;
              }

              private static long key(int score, int len, int idx) {
                  return ((long) (2047 - Math.min(score, 2047)) << 40) | ((long) Math.min(len, 1023) << 30) | idx;
              }

              /** Zone du nom à surligner : {début, fin} ou null. */
              static int[] highlight(String name, String rawQuery) {
                  String norm = Norm.of(name);
                  if (norm.length() != name.length()) return null;
                  String phrase = Norm.of(rawQuery).trim().replaceAll("\\s+", " ");
                  if (phrase.isEmpty()) return null;
                  int i = norm.indexOf(phrase);
                  if (i >= 0) return new int[]{i, i + phrase.length()};
                  String[] toks = tokens(phrase);
                  for (String t : toks) {
                      i = norm.indexOf(t);
                      if (i >= 0) return new int[]{i, i + t.length()};
                  }
                  return null;
              }

              static Snapshot build(ArrayList<String[]> rows) {
                  Snapshot s = new Snapshot();
                  s.n = rows.size();
                  s.name = new String[s.n];
                  s.norm = new String[s.n];
                  s.parent = new int[s.n];
                  s.size = new long[s.n];
                  s.mtime = new long[s.n];
                  s.flags = new byte[s.n];
                  s.type = new byte[s.n];
                  ArrayList<String> dirs = new ArrayList<>();
                  java.util.HashMap<String, Integer> map = new java.util.HashMap<>();
                  for (int i = 0; i < s.n; i++) {
                      String[] r = rows.get(i);
                      Integer d = map.get(r[0]);
                      if (d == null) {
                          d = dirs.size();
                          dirs.add(r[0]);
                          map.put(r[0], d);
                      }
                      s.parent[i] = d;
                      s.name[i] = r[1];
                      s.norm[i] = Norm.of(r[1]);
                      s.type[i] = InstantSearch.typeOf(r[1]);
                  }
                  s.dirs = dirs.toArray(new String[0]);
                  return s;
              }
          }
          FIN_DU_FICHIER
          echo '' | base64 -d > app/release.jks

      - name: Compiler l'APK
        working-directory: projet
        run: |
          gradle assembleRelease --no-daemon --stacktrace
          mkdir -p ../sortie
          cp app/build/outputs/apk/release/*.apk ../sortie/FichiersPro.apk

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: FichiersPro-APK
          path: sortie/FichiersPro.apk
