              // ---------------------------------------------------------------- opérations

              static class Op {
                  volatile boolean cancel;
                  volatile long total, done;
                  volatile String current = "";
                  int errors;
                  String msg;
              }

              interface Job {
                  void run(Op op) throws Exception;
              }

              interface Done {
                  void done(Op op);
              }

              void runOp(String title, final Job job, final Done after) {
                  final Op op = new Op();
                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setPadding(dp(24), dp(12), dp(24), dp(4));
                  final TextView tv = text("Préparation…", 13, cSub, false);
                  tv.setMaxLines(3);
                  final ProgressBar pb = new ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal);
                  pb.setMax(1000);
                  pb.setIndeterminate(true);
                  box.addView(pb, new LinearLayout.LayoutParams(-1, -2));
                  box.addView(tv);
                  final AlertDialog d = new AlertDialog.Builder(this).setTitle(title).setView(box).setCancelable(false)
                          .setNegativeButton("Annuler", (di, w) -> op.cancel = true).create();
                  d.show();
                  final Runnable tick = new Runnable() {
                      @Override
                      public void run() {
                          if (op.total > 0) {
                              pb.setIndeterminate(false);
                              pb.setProgress((int) Math.min(1000, op.done * 1000 / op.total));
                              tv.setText(op.current + "\n" + fmtSize(op.done) + " / " + fmtSize(op.total));
                          } else {
                              tv.setText(op.current);
                          }
                          ui.postDelayed(this, 200);
                      }
                  };
                  ui.post(tick);
                  bg.execute(() -> {
                      String err = null;
                      try {
                          job.run(op);
                      } catch (Throwable t) {
                          err = t.getMessage() != null ? t.getMessage() : t.toString();
                      }
                      final String fe = err;
                      ui.post(() -> {
                          ui.removeCallbacks(tick);
                          try {
                              d.dismiss();
                          } catch (Exception ignored) {
                          }
                          if (isFinishing()) return;
                          if (fe != null) toast("Erreur : " + fe);
                          else if (op.cancel) toast("Opération annulée");
                          else if (op.errors > 0) toast(op.errors + " erreur(s) pendant l'opération");
                          else if (op.msg != null) toast(op.msg);
                          if (after != null) after.done(op);
                          if (mode == M_LIST || mode == M_SEARCH) {
                              HashSet<File> gone = new HashSet<>();
                              for (File f : selected) if (!f.exists()) gone.add(f);
                              if (!gone.isEmpty()) items.removeAll(gone);
                          }
                          selected.clear();
                          refresh();
                          updateHeader();
                          if (index != null) index.requestSync(false);
                      });
                  });
              }

              static long sizeRec(File f) {
                  if (!f.isDirectory()) return f.length();
                  long t = 0;
                  ArrayDeque<File> st = new ArrayDeque<>();
                  st.push(f);
                  while (!st.isEmpty()) {
                      File[] fs = st.pop().listFiles();
                      if (fs == null) continue;
                      for (File c : fs) {
                          if (c.isDirectory()) st.push(c);
                          else t += c.length();
                      }
                  }
                  return t;
              }

              static boolean deleteRec(File f) {
                  if (f.isDirectory()) {
                      File[] fs = f.listFiles();
                      if (fs != null) for (File c : fs) deleteRec(c);
                  }
                  return f.delete() || !f.exists();
              }

              static File uniqueDest(File dir, String name) {
                  File d = new File(dir, name);
                  if (!d.exists()) return d;
                  String base = name, ex = "";
                  int dot = name.lastIndexOf('.');
                  if (dot > 0) {
                      base = name.substring(0, dot);
                      ex = name.substring(dot);
                  }
                  for (int i = 1; ; i++) {
                      d = new File(dir, base + " (" + i + ")" + ex);
                      if (!d.exists()) return d;
                  }
              }

              void copyRec(File s, File d, Op op) {
                  if (op.cancel) return;
                  if (s.isDirectory()) {
                      if (!d.exists() && !d.mkdirs()) {
                          op.errors++;
                          return;
                      }
                      File[] fs = s.listFiles();
                      if (fs != null) for (File c : fs) copyRec(c, new File(d, c.getName()), op);
                  } else {
                      op.current = s.getName();
                      try (InputStream in = new FileInputStream(s); OutputStream out = new FileOutputStream(d)) {
                          byte[] buf = new byte[128 * 1024];
                          int n;
                          while ((n = in.read(buf)) > 0) {
                              if (op.cancel) break;
                              out.write(buf, 0, n);
                              op.done += n;
                          }
                      } catch (IOException e) {
                          op.errors++;
                      }
                      if (op.cancel) d.delete();
                      else d.setLastModified(s.lastModified());
                  }
              }

              void setClip(boolean cut) {
                  clipboard.clear();
                  clipboard.addAll(selected);
                  clipCut = cut;
                  selected.clear();
                  refreshSelectionUi();
                  toast(clipboard.size() + " élément(s) " + (cut ? "coupé(s)" : "copié(s)") + " — ouvrez le dossier de destination puis « Coller ici »");
              }

              void paste() {
                  final ArrayList<File> src = new ArrayList<>(clipboard);
                  final boolean cut = clipCut;
                  final File dest = currentDir;
                  String destPath = dest.getAbsolutePath() + "/";
                  for (File s : src) {
                      if (s.isDirectory() && destPath.startsWith(s.getAbsolutePath() + "/")) {
                          toast("Impossible de coller un dossier dans lui-même");
                          return;
                      }
                  }
                  if (cut) clipboard.clear();
                  runOp(cut ? "Déplacement…" : "Copie…", op -> {
                      long total = 0;
                      for (File s : src) total += sizeRec(s);
                      op.total = total;
                      for (File s : src) {
                          if (op.cancel) break;
                          if (!s.exists()) {
                              op.errors++;
                              continue;
                          }
                          if (cut && dest.equals(s.getParentFile())) continue;
                          File d = uniqueDest(dest, s.getName());
                          op.current = s.getName();
                          if (cut) {
                              long sz = sizeRec(s);
                              if (s.renameTo(d)) {
                                  op.done += sz;
                              } else {
                                  int before = op.errors;
                                  copyRec(s, d, op);
                                  if (!op.cancel && op.errors == before) deleteRec(s);
                              }
                          } else {
                              copyRec(s, d, op);
                          }
                      }
                      op.msg = src.size() + " élément(s) " + (cut ? "déplacé(s)" : "copié(s)");
                  }, null);
              }

