                  emptyView.setText(mode == M_TRASH ? "🗑\n\nLa corbeille est vide"
                          : mode == M_SEARCH ? "🔎\n\nAucun résultat"
                          : mode == M_LIST ? "📂\n\nAucun fichier dans cette catégorie" : "📂\n\nDossier vide");
                  emptyView.setVisibility(show ? View.VISIBLE : View.GONE);
              }

              void updateHeader() {
                  topActions.removeAllViews();
                  typeScroll.setVisibility(mode == M_SEARCH && instantMode && selected.isEmpty() ? View.VISIBLE : View.GONE);
                  searchInfo.setVisibility(mode == M_SEARCH && selected.isEmpty() ? View.VISIBLE : View.GONE);
                  boolean bar = mode == M_SEARCH && selected.isEmpty();
