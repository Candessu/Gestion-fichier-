          mkdir -p app/src/main/java/com/fichierspro/app
          cat > app/src/main/java/com/fichierspro/app/EditorActivity.java << 'FIN_DU_FICHIER'
          package com.fichierspro.app;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.text.Editable;
          import android.text.InputType;
          import android.text.TextUtils;
          import android.text.TextWatcher;
          import android.util.TypedValue;
          import android.view.Gravity;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;

          public class EditorActivity extends Activity {

              File file;
              EditText et;
              TextView title;
              boolean dirty, loaded;
              final Handler ui = new Handler(Looper.getMainLooper());

              int dp(float v) {
                  return (int) (v * getResources().getDisplayMetrics().density + 0.5f);
              }

              @Override
              protected void onCreate(Bundle state) {
                  boolean dark = getSharedPreferences("fp", MODE_PRIVATE).getBoolean("dark", false);
                  setTheme(dark ? R.style.AppDark : R.style.AppTheme);
                  super.onCreate(state);
                  int bg = dark ? 0xFF121417 : 0xFFFFFFFF;
                  int fg = dark ? 0xFFECEFF1 : 0xFF1A1F24;
                  int primary = dark ? 0xFF1E88E5 : 0xFF1565C0;
                  getWindow().setStatusBarColor(MainActivity.darker(primary));
                  String path = getIntent().getStringExtra("path");
                  if (path == null) {
                      finish();
                      return;
                  }
                  file = new File(path);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(bg);
                  LinearLayout top = new LinearLayout(this);
                  top.setGravity(Gravity.CENTER_VERTICAL);
                  top.setBackgroundColor(primary);
                  top.setPadding(dp(4), dp(8), dp(4), dp(8));
                  top.setElevation(dp(4));
                  top.addView(btn("←", () -> onBackPressed()));
                  title = new TextView(this);
                  title.setText(file.getName());
                  title.setTextColor(Color.WHITE);
                  title.setTextSize(18);
                  title.setTypeface(Typeface.DEFAULT_BOLD);
                  title.setSingleLine(true);
                  title.setEllipsize(TextUtils.TruncateAt.MIDDLE);
                  title.setPadding(dp(8), 0, dp(8), 0);
                  top.addView(title, new LinearLayout.LayoutParams(0, -2, 1));
                  top.addView(btn("A−", () -> zoom(-1)));
                  top.addView(btn("A+", () -> zoom(1)));
                  top.addView(btn("💾", this::save));
                  root.addView(top, new LinearLayout.LayoutParams(-1, -2));

                  et = new EditText(this);
                  et.setGravity(Gravity.TOP | Gravity.START);
                  et.setTypeface(Typeface.MONOSPACE);
                  et.setTextSize(TypedValue.COMPLEX_UNIT_SP, getSharedPreferences("fp", MODE_PRIVATE).getFloat("edsize", 14));
                  et.setTextColor(fg);
                  et.setBackgroundColor(bg);
                  et.setPadding(dp(12), dp(12), dp(12), dp(12));
                  et.setInputType(InputType.TYPE_CLASS_TEXT | InputType.TYPE_TEXT_FLAG_MULTI_LINE | InputType.TYPE_TEXT_FLAG_NO_SUGGESTIONS);
                  et.setHint("Chargement…");
                  root.addView(et, new LinearLayout.LayoutParams(-1, 0, 1));
                  setContentView(root);

                  new Thread(() -> {
                      String txt;
                      try (InputStream in = new FileInputStream(file)) {
                          ByteArrayOutputStream bo = new ByteArrayOutputStream();
                          byte[] buf = new byte[65536];
                          int n;
                          while ((n = in.read(buf)) > 0) bo.write(buf, 0, n);
                          txt = new String(bo.toByteArray(), StandardCharsets.UTF_8);
                      } catch (Exception e) {
                          txt = null;
                      }
                      final String t = txt;
                      ui.post(() -> {
                          if (t == null) {
                              Toast.makeText(this, "Lecture impossible", Toast.LENGTH_SHORT).show();
                              finish();
                              return;
                          }
                          et.setText(t);
                          et.setHint("");
                          loaded = true;
                          et.addTextChangedListener(new TextWatcher() {
                              public void beforeTextChanged(CharSequence s, int a, int b, int c) {
                              }

                              public void onTextChanged(CharSequence s, int a, int b, int c) {
                              }

                              public void afterTextChanged(Editable s) {
                                  if (!dirty) {
                                      dirty = true;
                                      title.setText("● " + file.getName());
                                  }
                              }
                          });
                      });
                  }).start();
              }

              TextView btn(String s, Runnable r) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextColor(Color.WHITE);
                  t.setTextSize(18);
                  t.setGravity(Gravity.CENTER);
                  t.setMinWidth(dp(44));
                  t.setPadding(dp(8), dp(6), dp(8), dp(6));
                  TypedValue tv = new TypedValue();
                  getTheme().resolveAttribute(android.R.attr.selectableItemBackgroundBorderless, tv, true);
                  t.setBackground(getDrawable(tv.resourceId));
                  t.setOnClickListener(v -> r.run());
                  return t;
              }

              void zoom(int d) {
                  float px = et.getTextSize() / getResources().getDisplayMetrics().scaledDensity;
                  float sp = Math.max(8, Math.min(32, Math.round(px) + d * 2));
                  et.setTextSize(TypedValue.COMPLEX_UNIT_SP, sp);
                  getSharedPreferences("fp", MODE_PRIVATE).edit().putFloat("edsize", sp).apply();
              }

              void save() {
                  save(null);
              }

              void save(final Runnable after) {
                  if (!loaded) return;
                  final String txt = et.getText().toString();
                  new Thread(() -> {
                      boolean ok;
                      try (OutputStream o = new FileOutputStream(file)) {
                          o.write(txt.getBytes(StandardCharsets.UTF_8));
                          ok = true;
                      } catch (Exception e) {
                          ok = false;
                      }
                      final boolean fok = ok;
                      ui.post(() -> {
                          Toast.makeText(this, fok ? "Enregistré ✓" : "Échec de l'enregistrement", Toast.LENGTH_SHORT).show();
                          if (fok) {
                              dirty = false;
                              title.setText(file.getName());
                              if (after != null) after.run();
                          }
                      });
                  }).start();
              }

              @Override
              public void onBackPressed() {
                  if (!dirty) {
                      super.onBackPressed();
                      return;
                  }
                  new AlertDialog.Builder(this).setTitle("Modifications non enregistrées")
                          .setMessage("Voulez-vous enregistrer avant de quitter ?")
                          .setPositiveButton("Enregistrer", (d, w) -> save(this::finish))
                          .setNeutralButton("Quitter sans enregistrer", (d, w) -> finish())
                          .setNegativeButton("Annuler", null).show();
              }
          }
          FIN_DU_FICHIER
          mkdir -p app/src/main/java/com/fichierspro/app
          cat > app/src/main/java/com/fichierspro/app/FileIcon.java << 'FIN_DU_FICHIER'
          package com.fichierspro.app;

          import android.graphics.Canvas;
          import android.graphics.ColorFilter;
          import android.graphics.Paint;
          import android.graphics.Path;
          import android.graphics.PixelFormat;
          import android.graphics.Rect;
          import android.graphics.RectF;
          import android.graphics.Typeface;
          import android.graphics.drawable.Drawable;

          import java.util.HashMap;
          import java.util.Locale;

          /**
           * Icône dessinée selon le format réel du fichier : page avec coin plié,
           * bandeau de couleur du format (Word bleu, PDF rouge, Excel vert, PowerPoint orange…)
           * et extension écrite dessus. Dossier dessiné à part.
           */
          final class FileIcon extends Drawable {

              static final class Style {
                  final int color;
                  final String label;

                  Style(int c, String l) {
                      color = c;
                      label = l;
                  }
              }

              private static final HashMap<String, Integer> COLORS = new HashMap<>();
              private static final HashMap<String, String> LABELS = new HashMap<>();

              private static void put(int color, String exts) {
                  for (String e : exts.split(" ")) COLORS.put(e, color);
              }

              static {
                  put(0xFF2B579A, "doc docx docm dot dotx odt rtf wps pages");
                  put(0xFFD93025, "pdf");
                  put(0xFF1E7145, "xls xlsx xlsm xlsb xlt xltx ods csv tsv numbers");
                  put(0xFFD24726, "ppt pptx pptm pps ppsx pot potx odp key");
                  put(0xFF546E7A, "txt md log ini conf cfg properties srt sub nfo");
                  put(0xFF6A1B9A, "java kt js ts py c cpp h cs php rb go rs swift sh bat sql gradle xml json yml yaml css");
                  put(0xFFE65100, "html htm xhtml mht");
                  put(0xFF795548, "epub mobi azw azw3 fb2 djvu cbz cbr");
                  put(0xFFF9A825, "zip rar 7z tar gz tgz bz2 xz zst cab iso");
                  put(0xFF2E9E4F, "apk xapk apks aab");
                  put(0xFF37474F, "exe msi jar com cmd deb appimage");
                  put(0xFF8E24AA, "mp3 wav ogg m4a aac flac amr opus wma mid midi aiff");
                  put(0xFFC2185B, "mp4 mkv avi mov 3gp webm flv wmv m4v ts mpg mpeg vob");
                  put(0xFF00897B, "jpg jpeg png gif bmp webp heic heif svg tif tiff ico raw dng psd");
                  put(0xFF3949AB, "vcf ics");
                  put(0xFF00838F, "ttf otf woff woff2");
                  put(0xFF5D4037, "db sqlite sqlite3 bak");
                  LABELS.put("docx", "DOCX");
                  LABELS.put("jpeg", "JPG");
                  LABELS.put("xlsx", "XLSX");
                  LABELS.put("pptx", "PPTX");
              }

              static Style styleOf(String ext) {
                  Integer c = COLORS.get(ext);
                  String l = LABELS.get(ext);
                  if (l == null) l = ext.length() <= 4 ? ext.toUpperCase(Locale.ROOT) : ext.substring(0, 4).toUpperCase(Locale.ROOT);
                  return new Style(c != null ? c : 0xFF78909C, l);
              }

              private final boolean folder, dark;
              private final Style st;
              private final Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Path path = new Path();
              private final RectF r = new RectF();

              FileIcon(boolean folder, String ext, boolean dark) {
                  this.folder = folder;
                  this.dark = dark;
                  this.st = folder ? new Style(0xFFFFB300, "") : styleOf(ext);
                  p.setTypeface(Typeface.DEFAULT_BOLD);
                  p.setTextAlign(Paint.Align.CENTER);
              }

              static int mix(int a, int b, float t) {
                  int ar = (a >> 16) & 255, ag = (a >> 8) & 255, ab = a & 255;
                  int br = (b >> 16) & 255, bg = (b >> 8) & 255, bb = b & 255;
                  return 0xFF000000 | ((int) (ar + (br - ar) * t) << 16) | ((int) (ag + (bg - ag) * t) << 8) | (int) (ab + (bb - ab) * t);
              }

              @Override
              public void draw(Canvas c) {
                  Rect b = getBounds();
                  float s = Math.min(b.width(), b.height());
                  float ox = b.left + (b.width() - s) / 2f, oy = b.top + (b.height() - s) / 2f;
                  if (folder) drawFolder(c, ox, oy, s);
                  else drawPage(c, ox, oy, s);
              }

              private void drawFolder(Canvas c, float x, float y, float s) {
                  float l = x + s * 0.10f, rr = x + s * 0.90f, t = y + s * 0.20f, bot = y + s * 0.82f, k = s * 0.06f;
                  p.setStyle(Paint.Style.FILL);
                  p.setColor(0xFFF0A000);
                  path.reset();
                  path.moveTo(l, t + k);
                  path.quadTo(l, t, l + k, t);
                  path.lineTo(x + s * 0.38f, t);
                  path.lineTo(x + s * 0.46f, t + s * 0.09f);
                  path.lineTo(rr - k, t + s * 0.09f);
                  path.quadTo(rr, t + s * 0.09f, rr, t + s * 0.09f + k);
                  path.lineTo(rr, bot - k);
                  path.lineTo(l, bot - k);
                  path.close();
                  c.drawPath(path, p);
                  p.setColor(0xFFFFCA28);
                  r.set(l, t + s * 0.19f, rr, bot);
                  c.drawRoundRect(r, k, k, p);
              }

              private void drawPage(Canvas c, float x, float y, float s) {
                  float w = s * 0.66f, h = s * 0.84f;
                  float l = x + (s - w) / 2f + s * 0.04f, t = y + (s - h) / 2f, rr = l + w, bot = t + h;
                  float fold = w * 0.30f, k = s * 0.06f;
                  int base = dark ? 0xFF2A2F35 : 0xFFFFFFFF;
                  p.setStyle(Paint.Style.FILL);
                  // page
                  path.reset();
                  path.moveTo(l + k, t);
                  path.lineTo(rr - fold, t);
                  path.lineTo(rr, t + fold);
                  path.lineTo(rr, bot - k);
                  path.quadTo(rr, bot, rr - k, bot);
                  path.lineTo(l + k, bot);
                  path.quadTo(l, bot, l, bot - k);
                  path.lineTo(l, t + k);
                  path.quadTo(l, t, l + k, t);
                  path.close();
                  p.setColor(mix(st.color, base, dark ? 0.70f : 0.86f));
                  c.drawPath(path, p);
                  // coin plié
                  path.reset();
                  path.moveTo(rr - fold, t);
                  path.lineTo(rr - fold, t + fold - k * 0.6f);
                  path.quadTo(rr - fold, t + fold, rr - fold + k * 0.6f, t + fold);
                  path.lineTo(rr, t + fold);
                  path.close();
                  p.setColor(mix(st.color, base, dark ? 0.35f : 0.55f));
                  c.drawPath(path, p);
                  // lignes de texte stylisées
                  p.setColor(mix(st.color, base, dark ? 0.50f : 0.65f));
                  float lh = s * 0.035f;
                  for (int i = 0; i < 2; i++) {
                      float ly = t + s * 0.17f + i * s * 0.09f;
                      r.set(l + w * 0.16f, ly, rr - w * (i == 0 ? 0.42f : 0.20f), ly + lh);
                      c.drawRoundRect(r, lh / 2, lh / 2, p);
                  }
                  // bandeau du format
                  float bh = s * 0.27f, bt = bot - s * 0.10f - bh;
                  r.set(x + s * 0.06f, bt, rr - w * 0.10f, bt + bh);
                  p.setColor(st.color);
                  c.drawRoundRect(r, s * 0.05f, s * 0.05f, p);
                  if (!st.label.isEmpty()) {
                      p.setColor(0xFFFFFFFF);
                      float ts = s * (st.label.length() <= 3 ? 0.20f : 0.16f);
                      p.setTextSize(ts);
                      float maxW = r.width() * 0.88f;
                      float tw = p.measureText(st.label);
                      if (tw > maxW) p.setTextSize(ts * maxW / tw);
                      Paint.FontMetrics fm = p.getFontMetrics();
                      c.drawText(st.label, r.centerX(), r.centerY() - (fm.ascent + fm.descent) / 2f, p);
                  }
              }

              @Override
              public void setAlpha(int a) {
                  p.setAlpha(a);
              }

              @Override
              public void setColorFilter(ColorFilter cf) {
                  p.setColorFilter(cf);
              }

              @Override
              public int getOpacity() {
                  return PixelFormat.TRANSLUCENT;
              }
          }
          FIN_DU_FICHIER
          mkdir -p app/src/main/java/com/fichierspro/app
          cat > app/src/main/java/com/fichierspro/app/FileIndex.java << 'FIN_DU_FICHIER'
          package com.fichierspro.app;

          import android.content.Context;
          import android.content.SharedPreferences;
          import android.database.Cursor;
          import android.database.sqlite.SQLiteDatabase;
          import android.database.sqlite.SQLiteOpenHelper;
          import android.database.sqlite.SQLiteStatement;
          import android.os.Environment;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.SystemClock;
          import android.provider.MediaStore;

          import java.io.File;
          import java.util.ArrayList;
          import java.util.Arrays;
          import java.util.HashMap;
          import java.util.HashSet;
          import java.util.List;
          import java.util.Locale;
          import java.util.Map;
          import java.util.concurrent.atomic.AtomicBoolean;
          import java.util.concurrent.atomic.AtomicLong;

          /**
           * Index persistant du stockage (SQLite).
           * - Les écrans lisent l'index : affichage immédiat, même au démarrage à froid.
           * - La mise à jour se fait en arrière-plan, de façon incrémentale (seuls les dossiers modifiés sont relus).
           * - Au tout premier lancement, l'index est amorcé depuis MediaStore (l'index du système).
           */
          final class FileIndex extends SQLiteOpenHelper {

              static final int BIG = 100;
              static final long BIG_MIN = 10L * 1024 * 1024;
              private static final long FULL_EVERY = 6L * 3600 * 1000;

              private static FileIndex inst;

              static synchronized FileIndex get(Context c) {
                  if (inst == null) inst = new FileIndex(c.getApplicationContext());
                  return inst;
              }

              private final Context ctx;
              private final Handler ui = new Handler(Looper.getMainLooper());
              final AtomicLong version = new AtomicLong(1);
              volatile boolean syncing;
              volatile Runnable listener;
              private boolean again, againFull;
              private volatile long lastNotify, lastSyncEnd;
              private volatile SearchEngine.Snapshot snap;
              private volatile boolean reloading;
              /** La recherche instantanée a besoin de l'ordre alphabétique : il est préparé avec l'instantané. */
              volatile boolean wantByName;
              private final Object snapLock = new Object();

              private FileIndex(Context c) {
                  super(c, "index.db", null, 2);
                  ctx = c;
                  setWriteAheadLoggingEnabled(true);
              }

              @Override
              public void onConfigure(SQLiteDatabase db) {
                  try {
                      db.execSQL("PRAGMA synchronous=NORMAL");
                  } catch (Throwable ignored) {
                  }
              }

              @Override
              public void onCreate(SQLiteDatabase db) {
                  db.execSQL("CREATE TABLE files(path TEXT PRIMARY KEY, parent TEXT NOT NULL, name TEXT NOT NULL,"
                          + " size INTEGER NOT NULL, mtime INTEGER NOT NULL, isdir INTEGER NOT NULL,"
                          + " cat INTEGER NOT NULL, hidden INTEGER NOT NULL)");
                  db.execSQL("CREATE INDEX idx_parent ON files(parent)");
                  db.execSQL("CREATE INDEX idx_cat ON files(cat, mtime)");
                  db.execSQL("CREATE INDEX idx_size ON files(size)");
                  db.execSQL("CREATE TABLE dirs(path TEXT PRIMARY KEY, mtime INTEGER NOT NULL)");
              }

              @Override
              public void onUpgrade(SQLiteDatabase db, int o, int n) {
                  db.execSQL("DROP TABLE IF EXISTS files");
                  db.execSQL("DROP TABLE IF EXISTS dirs");
                  onCreate(db);
                  ctx.getSharedPreferences("fp", 0).edit().remove("idx_full").apply();
              }

              @Override
              public void onDowngrade(SQLiteDatabase db, int o, int n) {
                  onUpgrade(db, o, n);
              }

              // ------------------------------------------------------------ racines

              static File internalRoot() {
                  return Environment.getExternalStorageDirectory();
              }

              static String trashPath() {
                  return new File(internalRoot(), ".CorbeilleFichiersPro").getAbsolutePath();
              }

              static List<String> roots(Context c) {
                  ArrayList<String> out = new ArrayList<>();
                  out.add(internalRoot().getAbsolutePath());
                  try {
                      File[] dirs = c.getExternalFilesDirs(null);
                      if (dirs != null) {
                          for (int i = 1; i < dirs.length; i++) {
                              if (dirs[i] == null) continue;
                              String p = dirs[i].getAbsolutePath();
                              int k = p.indexOf("/Android/data");
                              if (k > 0) {
                                  String r = p.substring(0, k);
                                  if (!out.contains(r)) out.add(r);
                              }
                          }
                      }
                  } catch (Throwable ignored) {
                  }
                  return out;
              }

              static int catOf(String name) {
                  int i = name.lastIndexOf('.');
                  if (i <= 0) return 0;
                  String e = name.substring(i + 1).toLowerCase(Locale.ROOT);
                  if (MainActivity.IMG.contains(e)) return 1;
                  if (MainActivity.VID.contains(e)) return 2;
                  if (MainActivity.AUD.contains(e)) return 3;
                  if (MainActivity.DOC.contains(e)) return 4;
                  if (MainActivity.APK.contains(e)) return 5;
                  if (MainActivity.ARC.contains(e)) return 6;
                  return 0;
              }

              private static boolean hiddenDir(String dir, List<String> roots) {
                  if (dir.contains("/.")) return true;
                  for (String r : roots) {
                      if (dir.startsWith(r)) {
                          String rel = dir.substring(r.length());
                          if (rel.equals("/Android/data") || rel.startsWith("/Android/data/")
                                  || rel.equals("/Android/obb") || rel.startsWith("/Android/obb/")) return true;
                      }
                  }
                  return false;
              }

              // ------------------------------------------------------------ synchronisation

              void syncIfStale(long ms) {
                  if (!syncing && SystemClock.uptimeMillis() - lastSyncEnd > ms) requestSync(false);
              }

              synchronized void requestSync(boolean full) {
                  if (syncing) {
                      again = true;
                      againFull |= full;
                      return;
                  }
                  syncing = true;
                  final boolean f = full;
                  Thread t = new Thread(new Runnable() {
                      @Override
                      public void run() {
                          runSync(f);
                      }
                  }, "index-sync");
                  t.setPriority(Thread.NORM_PRIORITY - 1);
                  t.start();
              }

              private void runSync(boolean full) {
                  boolean f = full;
                  while (true) {
                      try {
                          doSync(f);
                      } catch (Throwable ignored) {
                      }
                      synchronized (this) {
                          if (again) {
                              again = false;
                              f = againFull;
                              againFull = false;
                              continue;
                          }
                          syncing = false;
                          lastSyncEnd = SystemClock.uptimeMillis();
                          break;
                      }
                  }
                  post();
              }

              private void post() {
                  lastNotify = SystemClock.uptimeMillis();
                  ui.post(new Runnable() {
                      @Override
                      public void run() {
                          Runnable l = listener;
                          if (l != null) l.run();
                      }
                  });
              }

              private void changed() {
                  version.incrementAndGet();
                  if (SystemClock.uptimeMillis() - lastNotify >= 800) post();
              }

              private static void range(SQLiteDatabase db, String table, String dir) {
                  db.execSQL("DELETE FROM " + table + " WHERE path >= ? AND path < ?", new Object[]{dir + "/", dir + "0"});
              }

              private void doSync(boolean fullAsked) {
                  final SQLiteDatabase db = getWritableDatabase();
                  final SharedPreferences prefs = ctx.getSharedPreferences("fp", 0);
                  final long now = System.currentTimeMillis();
                  final boolean full = fullAsked || now - prefs.getLong("idx_full", 0) > FULL_EVERY;
                  final List<String> roots = roots(ctx);
                  final String trash = trashPath();

                  // lignes d'un stockage retiré (carte SD enlevée…)
                  StringBuilder w = new StringBuilder();
                  ArrayList<Object> args = new ArrayList<>();
                  for (String r : roots) {
                      if (w.length() > 0) w.append(" OR ");
                      w.append("(path >= ? AND path < ?)");
                      args.add(r + "/");
                      args.add(r + "0");
                  }
                  db.execSQL("DELETE FROM files WHERE NOT (" + w + ")", args.toArray());
                  db.execSQL("DELETE FROM dirs WHERE NOT (" + w + " OR path IN ("
                          + placeholders(roots.size()) + "))", concat(args, roots));

                  final SQLiteStatement ins = db.compileStatement(
                          "INSERT OR REPLACE INTO files(path,parent,name,size,mtime,isdir,cat,hidden) VALUES(?,?,?,?,?,?,?,?)");
                  final SQLiteStatement del = db.compileStatement("DELETE FROM files WHERE path=?");
                  final SQLiteStatement delDir = db.compileStatement("DELETE FROM dirs WHERE path=?");
                  final SQLiteStatement setDir = db.compileStatement("INSERT OR REPLACE INTO dirs(path,mtime) VALUES(?,?)");
                  final AtomicBoolean cancel = new AtomicBoolean();
                  try {
                      if (count(db) == 0) {
                          bootstrap(db, ins, roots, trash);
                          changed();
                          post();
                      }
                      final HashMap<String, Long> dirState = new HashMap<>();
                      final HashMap<String, ArrayList<String>> childDirs = new HashMap<>();
                      if (!full) {
                          Cursor c = db.rawQuery("SELECT path,mtime FROM dirs", null);
                          try {
                              while (c.moveToNext()) dirState.put(c.getString(0), c.getLong(1));
                          } finally {
                              c.close();
                          }
                          c = db.rawQuery("SELECT path,parent FROM files WHERE isdir=1", null);
                          try {
                              while (c.moveToNext()) {
                                  String par = c.getString(1);
                                  ArrayList<String> l = childDirs.get(par);
                                  if (l == null) {
                                      l = new ArrayList<>();
                                      childDirs.put(par, l);
                                  }
                                  l.add(c.getString(0));
                              }
                          } finally {
                              c.close();
                          }
                      }
                      HashSet<String> excluded = new HashSet<>();
                      excluded.add(trash);
                      final int[] n = {0, 0};
                      final long[] last = {SystemClock.uptimeMillis()};
                      int threads = Math.max(2, Math.min(4, Runtime.getRuntime().availableProcessors() - 1));
                      IndexWalker.walk(roots, dirState, childDirs, excluded, full, threads, new IndexWalker.Sink() {
                          @Override
                          public void onDir(IndexWalker.DirResult r) {
                              if (!db.inTransaction()) db.beginTransactionNonExclusive();
                              n[1] += applyDir(db, r, roots, trash, ins, del, delDir, setDir);
                              if (++n[0] % 120 == 0 || SystemClock.uptimeMillis() - last[0] > 500) {
                                  db.setTransactionSuccessful();
                                  db.endTransaction();
                                  last[0] = SystemClock.uptimeMillis();
                                  if (n[1] > 0) {
                                      n[1] = 0;
                                      changed();
                                  }
                              }
                          }
                      }, cancel);
                      if (db.inTransaction()) {
                          db.setTransactionSuccessful();
                          db.endTransaction();
                      }
                      if (n[1] > 0) version.incrementAndGet();
                      if (full) prefs.edit().putLong("idx_full", now).apply();
                  } finally {
                      cancel.set(true);
                      if (db.inTransaction()) db.endTransaction();
                      ins.close();
                      del.close();
                      delDir.close();
                      setDir.close();
                  }
              }

              private static String placeholders(int n) {
                  StringBuilder b = new StringBuilder();
                  for (int i = 0; i < n; i++) b.append(i == 0 ? "?" : ",?");
                  return b.toString();
              }

              private static Object[] concat(ArrayList<Object> a, List<String> b) {
                  ArrayList<Object> o = new ArrayList<>(a);
                  o.addAll(b);
                  return o.toArray();
              }

              private static long count(SQLiteDatabase db) {
                  Cursor c = db.rawQuery("SELECT COUNT(*) FROM files", null);
                  try {
                      return c.moveToFirst() ? c.getLong(0) : 0;
                  } finally {
                      c.close();
                  }
              }

              private static void bind(SQLiteStatement ins, String path, String parent, String name, long size, long mtime,
                                       boolean dir, boolean hidden) {
                  ins.bindString(1, path);
                  ins.bindString(2, parent);
                  ins.bindString(3, name);
                  ins.bindLong(4, size);
                  ins.bindLong(5, mtime);
                  ins.bindLong(6, dir ? 1 : 0);
                  ins.bindLong(7, dir ? 0 : catOf(name));
                  ins.bindLong(8, hidden ? 1 : 0);
                  ins.execute();
              }

              /** Premier lancement : on récupère tout de suite ce que le système a déjà indexé. */
              private void bootstrap(SQLiteDatabase db, SQLiteStatement ins, List<String> roots, String trash) {
                  Cursor c = null;
                  try {
                      c = ctx.getContentResolver().query(MediaStore.Files.getContentUri("external"),
                              new String[]{"_data", "_size", "date_modified"}, null, null, null);
                      if (c == null) return;
                      db.beginTransactionNonExclusive();
                      try {
                          String lastParent = null;
                          boolean lastHidden = false, lastOk = false;
                          while (c.moveToNext()) {
                              String path = c.getString(0);
                              if (path == null) continue;
                              int sl = path.lastIndexOf('/');
                              if (sl <= 0 || sl == path.length() - 1) continue;
                              String name = path.substring(sl + 1);
                              if (catOf(name) == 0) continue;
                              String parent = path.substring(0, sl);
                              if (!parent.equals(lastParent)) {
                                  lastParent = parent;
                                  lastOk = false;
                                  for (String r : roots) if (parent.equals(r) || parent.startsWith(r + "/")) lastOk = true;
                                  if (parent.equals(trash) || parent.startsWith(trash + "/")) lastOk = false;
                                  lastHidden = hiddenDir(parent, roots);
                              }
                              if (!lastOk) continue;
                              bind(ins, path, parent, name, c.isNull(1) ? 0 : c.getLong(1),
                                      c.isNull(2) ? 0 : c.getLong(2) * 1000L, false, lastHidden || name.startsWith("."));
                          }
                          db.setTransactionSuccessful();
                      } finally {
                          db.endTransaction();
                      }
                  } catch (Throwable ignored) {
                  } finally {
                      if (c != null) c.close();
                  }
              }

              private static int applyDir(SQLiteDatabase db, IndexWalker.DirResult r, List<String> roots, String trash,
                                          SQLiteStatement ins, SQLiteStatement del, SQLiteStatement delDir,
                                          SQLiteStatement setDir) {
                  String dir = r.dir;
                  HashMap<String, long[]> old = new HashMap<>();
                  Cursor c = db.rawQuery("SELECT name,size,mtime,isdir FROM files WHERE parent=?", new String[]{dir});
                  try {
                      while (c.moveToNext()) old.put(c.getString(0), new long[]{c.getLong(1), c.getLong(2), c.getLong(3)});
                  } finally {
                      c.close();
                  }
                  boolean dirHidden = hiddenDir(dir, roots);
                  // un fichier tout récent peut encore grossir (téléchargement, vidéo en cours) :
                  // dans ce cas le dossier sera relu au prochain passage
                  long youngAfter = System.currentTimeMillis() - 10 * 60 * 1000L;
                  boolean young = false;
                  int ch = 0;
                  for (IndexWalker.Entry e : r.entries) {
                      String path = IndexWalker.join(dir, e.name);
                      if (path.equals(trash)) continue;
                      if (!e.dir && e.mtime > youngAfter) young = true;
                      long[] o = old.remove(e.name);
                      boolean typeChanged = o != null && (o[2] == 1) != e.dir;
                      if (typeChanged) {
                          range(db, "files", path);
                          range(db, "dirs", path);
                          delDir.bindString(1, path);
                          delDir.execute();
                      }
                      if (o == null || typeChanged || o[0] != e.size || o[1] != e.mtime) {
                          bind(ins, path, dir, e.name, e.size, e.mtime, e.dir, dirHidden || e.name.startsWith("."));
                          ch++;
                      }
                  }
                  for (Map.Entry<String, long[]> g : old.entrySet()) {
                      String path = IndexWalker.join(dir, g.getKey());
                      del.bindString(1, path);
                      del.execute();
                      if (g.getValue()[2] == 1) {
                          range(db, "files", path);
                          range(db, "dirs", path);
                          delDir.bindString(1, path);
                          delDir.execute();
                      }
                      ch++;
                  }
                  setDir.bindString(1, dir);
                  setDir.bindLong(2, young ? 0 : r.mtime);
                  setDir.execute();
                  return ch;
              }

              // ------------------------------------------------------------ lectures

              private static String cond(int kind, boolean hidden, String scope) {
                  String c = kind == BIG ? "isdir=0 AND size>" + BIG_MIN : "cat=" + kind + " AND isdir=0";
                  if (!hidden) c += " AND hidden=0";
                  if (scope != null) c += " AND path >= ? AND path < ?";
                  return c;
              }

              private static String[] scopeArgs(String scope) {
                  return scope == null ? null : new String[]{scope + "/", scope + "0"};
              }

              /** Une page de la catégorie (limit = -1 : tout le reste). */
              ArrayList<IFile> list(int kind, boolean hidden, int limit, int offset) {
                  return list(kind, hidden, limit, offset, null);
              }

              /** Idem, limité à un dossier et ses sous-dossiers (scope = chemin du dossier, ou null). */
              ArrayList<IFile> list(int kind, boolean hidden, int limit, int offset, String scope) {
                  ArrayList<IFile> out = new ArrayList<>();
                  try {
                      Cursor c = getReadableDatabase().rawQuery("SELECT path,size,mtime FROM files WHERE " + cond(kind, hidden, scope)
                              + " ORDER BY " + (kind == BIG ? "size DESC" : "mtime DESC")
                              + " LIMIT " + limit + " OFFSET " + offset, scopeArgs(scope));
                      try {
                          while (c.moveToNext()) out.add(new IFile(c.getString(0), false, c.getLong(1), c.getLong(2)));
                      } finally {
                          c.close();
                      }
                  } catch (Throwable ignored) {
                  }
                  return out;
              }

              /** {nombre, taille totale} */
              long[] stats(int kind, boolean hidden) {
                  return stats(kind, hidden, null);
              }

              long[] stats(int kind, boolean hidden, String scope) {
                  long[] r = new long[2];
                  try {
                      Cursor c = getReadableDatabase().rawQuery("SELECT COUNT(*),SUM(size) FROM files WHERE "
                              + cond(kind, hidden, scope), scopeArgs(scope));
                      try {
                          if (c.moveToFirst()) {
                              r[0] = c.getLong(0);
                              r[1] = c.isNull(1) ? 0 : c.getLong(1);
                          }
                      } finally {
                          c.close();
                      }
                  } catch (Throwable ignored) {
                  }
                  return r;
              }

              /** [0] = gros fichiers, [1..6] = catégories, [7] = autres fichiers ; chaque ligne {nombre, taille}. */
              long[][] allStats(boolean hidden) {
                  return allStats(hidden, null);
              }

              long[][] allStats(boolean hidden, String scope) {
                  long[][] r = new long[8][2];
                  try {
                      Cursor c = getReadableDatabase().rawQuery("SELECT cat,COUNT(*),SUM(size) FROM files WHERE isdir=0"
                              + (hidden ? "" : " AND hidden=0") + (scope != null ? " AND path >= ? AND path < ?" : "")
                              + " GROUP BY cat", scopeArgs(scope));
                      try {
                          while (c.moveToNext()) {
                              int k = c.getInt(0);
                              int slot = k >= 1 && k <= 6 ? k : 7;
                              r[slot][0] += c.getLong(1);
                              r[slot][1] += c.isNull(2) ? 0 : c.getLong(2);
                          }
                      } finally {
                          c.close();
                      }
                  } catch (Throwable ignored) {
                  }
                  r[0] = stats(BIG, hidden, scope);
                  return r;
              }

              /** Taille d'un élément direct d'un dossier, sous-dossiers compris. */
              static final class Child {
                  String name;
                  long size, count;
                  boolean folder;
              }

              /** Contenu direct d'un dossier, trié du plus gros au plus petit (tous fichiers, cachés compris). */
              ArrayList<Child> childSizes(String dir) {
                  ArrayList<Child> out = new ArrayList<>();
                  try {
                      Cursor c = getReadableDatabase().rawQuery(
                              "SELECT CASE WHEN instr(rel,'/')>0 THEN substr(rel,1,instr(rel,'/')-1) ELSE rel END AS top,"
                                      + " SUM(size), COUNT(*), MAX(instr(rel,'/')>0)"
                                      + " FROM (SELECT substr(path, length(?)+2) AS rel, size FROM files"
                                      + " WHERE isdir=0 AND path >= ? AND path < ?)"
                                      + " GROUP BY top ORDER BY 2 DESC",
                              new String[]{dir, dir + "/", dir + "0"});
                      try {
                          while (c.moveToNext()) {
                              Child ch = new Child();
                              ch.name = c.getString(0);
                              ch.size = c.isNull(1) ? 0 : c.getLong(1);
                              ch.count = c.getLong(2);
                              ch.folder = c.getInt(3) != 0;
                              out.add(ch);
                          }
                      } finally {
                          c.close();
                      }
                  } catch (Throwable ignored) {
                  }
                  return out;
              }

              /** Instantané en mémoire pour la recherche ; rechargé seulement si l'index a changé. */
              SearchEngine.Snapshot snapshot() {
                  synchronized (snapLock) {
                      return loadSnapshot();
                  }
              }

              /**
               * Instantané immédiat : si l'index a changé, on renvoie l'ancien tout de suite
               * et on recharge en arrière-plan (la recherche est relancée quand c'est prêt).
               */
              SearchEngine.Snapshot snapshotFast() {
                  SearchEngine.Snapshot s = snap;
                  if (s == null) return snapshot();
                  if (s.version != version.get() && !reloading) {
                      reloading = true;
                      Thread t = new Thread(() -> {
                          try {
                              snapshot();
                          } catch (Throwable ignored) {
                          } finally {
                              reloading = false;
                          }
                          post();
                      }, "index-snapshot");
                      t.setPriority(Thread.NORM_PRIORITY - 1);
                      t.start();
                  }
                  return s;
              }

              private SearchEngine.Snapshot loadSnapshot() {
                  long v = version.get();
                  if (snap != null && snap.version == v) return snap;
                  SearchEngine.Snapshot s = new SearchEngine.Snapshot();
                  s.version = v;
                  int cap = 4096, n = 0;
                  s.name = new String[cap];
                  s.norm = new String[cap];
                  s.parent = new int[cap];
                  s.size = new long[cap];
                  s.mtime = new long[cap];
                  s.flags = new byte[cap];
                  s.type = new byte[cap];
                  ArrayList<String> dirs = new ArrayList<>();
                  HashMap<String, Integer> map = new HashMap<>();
                  try {
                      Cursor c = getReadableDatabase().rawQuery("SELECT parent,name,size,mtime,isdir,hidden FROM files", null);
                      try {
                          String lastP = null;
                          int lastD = 0;
                          while (c.moveToNext()) {
                              if (n == cap) {
                                  cap *= 2;
                                  s.name = Arrays.copyOf(s.name, cap);
                                  s.norm = Arrays.copyOf(s.norm, cap);
                                  s.parent = Arrays.copyOf(s.parent, cap);
                                  s.size = Arrays.copyOf(s.size, cap);
                                  s.mtime = Arrays.copyOf(s.mtime, cap);
                                  s.flags = Arrays.copyOf(s.flags, cap);
                                  s.type = Arrays.copyOf(s.type, cap);
                              }
                              String p = c.getString(0);
                              if (!p.equals(lastP)) {
                                  Integer d = map.get(p);
                                  if (d == null) {
                                      d = dirs.size();
                                      dirs.add(p);
                                      map.put(p, d);
                                  }
                                  lastP = p;
                                  lastD = d;
                              }
                              String name = c.getString(1);
                              s.parent[n] = lastD;
                              s.name[n] = name;
                              s.norm[n] = Norm.of(name);
                              s.size[n] = c.getLong(2);
                              s.mtime[n] = c.getLong(3);
                              boolean isDir = c.getInt(4) != 0;
                              s.flags[n] = (byte) ((isDir ? SearchEngine.F_DIR : 0)
                                      | (c.getInt(5) != 0 ? SearchEngine.F_HIDDEN : 0));
                              s.type[n] = isDir ? InstantSearch.T_DIR : InstantSearch.typeOf(name);
                              n++;
                          }
                      } finally {
                          c.close();
                      }
                  } catch (Throwable ignored) {
                  }
                  s.n = n;
                  s.dirs = dirs.toArray(new String[0]);
                  if (wantByName) InstantSearch.byName(s);
                  snap = s;
                  return s;
              }
          }
