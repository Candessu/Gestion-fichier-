              /** Barre empilée : chaque segment proportionnel à sa taille. */
              View stackBar(long[] sizes, int[] colors) {
                  LinearLayout bar = new LinearLayout(this);
                  bar.setOrientation(LinearLayout.HORIZONTAL);
                  bar.setBackground(round(cDivider, 6));
                  bar.setClipToOutline(true);
                  long sum = 0;
                  for (long v : sizes) sum += Math.max(0, v);
                  for (int i = 0; i < sizes.length; i++) {
                      if (sizes[i] <= 0 || sum == 0) continue;
                      View seg = new View(this);
                      seg.setBackgroundColor(colors[i]);
                      bar.addView(seg, new LinearLayout.LayoutParams(0, -1, (float) ((double) sizes[i] / sum)));
                  }
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(-1, dp(14));
                  lp.setMargins(dp(16), dp(10), dp(16), dp(6));
                  bar.setLayoutParams(lp);
                  return bar;
              }

              View legendRow(int color, String name, long size, String pct, View.OnClickListener l) {
                  LinearLayout r = new LinearLayout(this);
                  r.setGravity(Gravity.CENTER_VERTICAL);
                  r.setPadding(dp(16), dp(9), dp(16), dp(9));
                  if (l != null) {
                      r.setBackground(ripple(false));
                      r.setOnClickListener(l);
                  }
                  View dot = new View(this);
                  GradientDrawable g = new GradientDrawable();
                  g.setShape(GradientDrawable.OVAL);
                  g.setColor(color);
                  dot.setBackground(g);
                  r.addView(dot, new LinearLayout.LayoutParams(dp(12), dp(12)));
                  TextView n = text(name, 14, cText, false);
                  n.setPadding(dp(12), 0, 0, 0);
                  r.addView(n, new LinearLayout.LayoutParams(0, -2, 1));
                  if (pct != null) {
                      TextView p = text(pct, 12, cSub, false);
                      p.setPadding(0, 0, dp(12), 0);
                      r.addView(p);
                  }
                  r.addView(text(fmtSize(size), 14, cText, true));
                  if (l != null) r.addView(text("  ›", 14, cSub, false));
                  return r;
              }

              static String pct(long part, long whole) {
                  if (whole <= 0) return "";
                  double p = part * 100.0 / whole;
                  return String.format(Locale.FRANCE, p < 10 ? "%.1f %%" : "%.0f %%", p);
              }

              void renderAnalysis(final AnaData d, final boolean root) {
                  anaCol.removeAllViews();
                  long used = d.total - d.free;
                  if (index.syncing) {
                      TextView note = text("⏳  Indexation en cours : les tailles se complètent automatiquement.", 13, cSub, false);
                      note.setPadding(dp(6), 0, dp(6), dp(10));
                      anaCol.addView(note);
                  }
                  final String scope = anaDir.getAbsolutePath();
                  final String where = root ? "" : " — " + anaDir.getName();

                  // ---- carte 1 : occupation + répartition par type
                  LinearLayout c1 = anaCard();
                  long catSum = 0;
                  for (int k = 1; k <= 7; k++) catSum += d.cats[k][1];
                  if (root) {
                      int p = d.total > 0 ? (int) Math.round(used * 100.0 / d.total) : 0;
                      LinearLayout h = new LinearLayout(this);
                      h.setGravity(Gravity.CENTER_VERTICAL);
                      h.setPadding(dp(16), dp(16), dp(16), 0);
                      LinearLayout tc = new LinearLayout(this);
                      tc.setOrientation(LinearLayout.VERTICAL);
                      tc.addView(text(anaRoot.equals(internalRoot()) ? "💾  Stockage interne" : "💽  Carte SD / USB", 16, cText, true));
                      tc.addView(text(fmtSize(used) + " utilisés sur " + fmtSize(d.total) + "  •  " + fmtSize(d.free) + " libres", 12, cSub, false));
                      h.addView(tc, new LinearLayout.LayoutParams(0, -2, 1));
                      h.addView(text(p + " %", 30, p > 90 ? 0xFFE53935 : hi(), true));
                      c1.addView(h);
                      long sys = Math.max(0, used - catSum - d.trash);
                      long[] sizes = new long[10];
                      int[] cols = new int[10];
                      for (int k = 1; k <= 7; k++) {
                          sizes[k - 1] = d.cats[k][1];
                          cols[k - 1] = CAT_COLORS[k];
                      }
                      sizes[7] = d.trash;
                      cols[7] = 0xFF8D6E63;
                      sizes[8] = sys;
                      cols[8] = 0xFF546E7A;
                      sizes[9] = d.free;
                      cols[9] = cDivider;
                      c1.addView(stackBar(sizes, cols));
                  } else {
                      LinearLayout h = new LinearLayout(this);
                      h.setGravity(Gravity.CENTER_VERTICAL);
                      h.setPadding(dp(16), dp(16), dp(16), 0);
                      LinearLayout tc = new LinearLayout(this);
                      tc.setOrientation(LinearLayout.VERTICAL);
                      tc.addView(text("📁  " + anaDir.getName(), 16, cText, true));
                      tc.addView(text(fmtCount(d.dirCount) + " fichier(s)  •  " + pct(d.dirTotal, used) + " de l'espace utilisé", 12, cSub, false));
                      h.addView(tc, new LinearLayout.LayoutParams(0, -2, 1));
                      h.addView(text(fmtSize(d.dirTotal), 22, hi(), true));
                      c1.addView(h);
                      long[] sizes = new long[7];
                      int[] cols = new int[7];
                      for (int k = 1; k <= 7; k++) {
                          sizes[k - 1] = d.cats[k][1];
                          cols[k - 1] = CAT_COLORS[k];
                      }
                      c1.addView(stackBar(sizes, cols));
                  }
                  Integer[] order = {1, 2, 3, 4, 5, 6, 7};
                  java.util.Arrays.sort(order, (a, b) -> Long.compare(d.cats[b][1], d.cats[a][1]));
                  long base = root ? used : d.dirTotal;
                  for (final int k : order) {
                      if (d.cats[k][0] == 0) continue;
                      final String title = CAT_NAMES[k] + where;
                      c1.addView(legendRow(CAT_COLORS[k], CAT_NAMES[k] + "  (" + fmtCount(d.cats[k][0]) + ")", d.cats[k][1],
                              pct(d.cats[k][1], base), v -> showCategoryFromAna(title, k == 7 ? 0 : k, scope)));
                  }
                  if (root) {
                      if (d.trash > 0) c1.addView(legendRow(0xFF8D6E63, "Corbeille", d.trash, pct(d.trash, used), v -> showTrash()));
                      long sys = Math.max(0, used - catSum - d.trash);
                      if (sys > 0) c1.addView(legendRow(0xFF546E7A, "Système, applications et données", sys, pct(sys, used), null));
                      c1.addView(legendRow(cDivider, "Espace libre", d.free, pct(d.free, d.total), null));
                  }
                  View sp = new View(this);
                  c1.addView(sp, new LinearLayout.LayoutParams(-1, dp(8)));
                  anaCol.addView(c1);

                  // ---- carte 2 : fichiers volumineux
                  LinearLayout c2 = anaCard();
                  c2.addView(anaHead("📊  Fichiers volumineux (> 10 Mo)",
                          d.bigStats[0] > 0 ? fmtCount(d.bigStats[0]) + "  •  " + fmtSize(d.bigStats[1]) : null, null));
                  if (d.big.isEmpty()) {
                      TextView t = text("Aucun fichier de plus de 10 Mo ici.", 13, cSub, false);
                      t.setPadding(dp(16), dp(4), dp(16), dp(14));
                      c2.addView(t);
                  } else {
                      for (IFile f : d.big) c2.addView(anaRow(f, f.getName(), f.getParent(), f.length(), null, false));
                      TextView all = text("Voir les " + fmtCount(d.bigStats[0]) + " fichiers volumineux   ›", 14, hi(), true);
                      all.setPadding(dp(16), dp(13), dp(16), dp(14));
                      all.setBackground(ripple(false));
                      all.setOnClickListener(v -> showCategoryFromAna("Gros fichiers (> 10 Mo)" + where, FileIndex.BIG, scope));
                      c2.addView(all);
                  }
                  anaCol.addView(c2);

                  // ---- carte 3 : dossiers du plus gros au plus petit
                  LinearLayout c3 = anaCard();
                  c3.addView(anaHead(root ? "📁  Plus gros dossiers" : "📁  Contenu par taille", "📂 Ouvrir", v -> anaOpenFolder(anaDir, null)));
                  int shown = 0;
                  long restSize = 0, restCount = 0;
                  long denom = root ? Math.max(used, d.dirTotal) : d.dirTotal;
                  for (FileIndex.Child ch : d.kids) {
                      if (shown >= 80) {
                          restSize += ch.size;
                          restCount++;
                          continue;
                      }
                      File f = new File(anaDir, ch.name);
                      String sub = ch.folder ? fmtCount(ch.count) + " fichier(s)  •  " + fmtSize(ch.size) : fmtSize(ch.size);
                      c3.addView(anaRow(f, ch.name, sub, ch.size, pct(ch.size, denom), ch.folder));
                      View bar = barLine(denom > 0 ? (float) ((double) ch.size / denom) : 0f);
                      c3.addView(bar);
                      shown++;
                  }
                  if (restCount > 0) {
                      TextView more = text("+ " + fmtCount(restCount) + " autres éléments  •  " + fmtSize(restSize) + "   ›", 14, hi(), true);
                      more.setPadding(dp(16), dp(13), dp(16), dp(14));
                      more.setBackground(ripple(false));
                      more.setOnClickListener(v -> anaOpenFolder(anaDir, null));
                      c3.addView(more);
                  }
                  if (d.kids.isEmpty()) {
                      TextView t = text(index.syncing ? "Calcul en cours…" : "Ce dossier est vide.", 13, cSub, false);
                      t.setPadding(dp(16), dp(4), dp(16), dp(14));
                      c3.addView(t);
                  }
                  anaCol.addView(c3);

                  subText = root ? fmtSize(used) + " utilisés  •  " + fmtSize(d.free) + " libres"
                          : fmtSize(d.dirTotal) + "  •  " + fmtCount(d.dirCount) + " fichier(s)";
                  updateHeader();
              }

