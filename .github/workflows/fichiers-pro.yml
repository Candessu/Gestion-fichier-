              void moveToTrash(final ArrayList<File> fs) {
                  runOp("Mise à la corbeille…", op -> {
                      File t = trashDir();
                      if (!t.exists()) t.mkdirs();
                      long now = System.currentTimeMillis();
                      int i = 0, perm = 0;
                      SharedPreferences.Editor ed = prefs.edit();
                      for (File f : fs) {
                          if (op.cancel) break;
                          op.current = f.getName();
                          String tn = now + "_" + (i++) + "_" + f.getName();
                          File d = new File(t, tn);
                          if (f.renameTo(d)) {
                              ed.putString("tr:" + tn, f.getAbsolutePath());
                          } else if (deleteRec(f)) {
                              perm++;
                          } else {
                              op.errors++;
                          }
                      }
                      ed.apply();
                      op.msg = perm > 0 ? perm + " élément(s) supprimé(s) définitivement (autre stockage)"
                              : fs.size() + " élément(s) mis à la corbeille";
                  }, null);
              }

              void trashItemDialog(final File f) {
                  String orig = prefs.getString("tr:" + f.getName(), "inconnu");
                  new AlertDialog.Builder(this).setTitle(displayName(f))
