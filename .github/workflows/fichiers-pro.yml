                  if (mode != M_BROWSE || !selected.isEmpty() || currentDir == null) {
                      usageChip.setVisibility(View.GONE);
                      return;
                  }
                  final File r = rootOf(currentDir);
                  if (r.getPath().equals("/")) {
                      usageChip.setVisibility(View.GONE);
                      return;
                  }
                  long total = 0, free = 0;
                  try {
                      StatFs s = new StatFs(r.getPath());
                      total = s.getTotalBytes();
                      free = s.getAvailableBytes();
                  } catch (Exception ignored) {
                  }
                  int p = total > 0 ? (int) Math.round((total - free) * 100.0 / total) : 0;
                  usageChip.setText("◔ " + p + " % utilisé");
                  usageChip.setOnClickListener(v -> showAnalysis(r, currentDir));
                  usageChip.setVisibility(View.VISIBLE);
              }

