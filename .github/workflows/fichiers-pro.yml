                  Object[][] types = {{"Tout", -1}, {"🎵 Audio", (int) InstantSearch.T_AUD}, {"🗜 Compressé", (int) InstantSearch.T_ARC},
                          {"📄 Document", (int) InstantSearch.T_DOC}, {"⚙ Exécutable", (int) InstantSearch.T_EXE},
                          {"📁 Dossier", (int) InstantSearch.T_DIR}, {"🖼 Image", (int) InstantSearch.T_IMG},
                          {"🎬 Vidéo", (int) InstantSearch.T_VID}};
