                  fill.setBackground(round(hi(), 2));
                  b.addView(fill, new LinearLayout.LayoutParams(0, -1, Math.max(0.004f, frac)));
                  b.addView(new View(this), new LinearLayout.LayoutParams(0, -1, Math.max(0f, 1f - frac)));
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(-1, dp(4));
                  lp.setMargins(dp(66), 0, dp(16), dp(6));
                  b.setLayoutParams(lp);
                  return b;
              }

              View anaRow(final File f, String name, String sub, long size, String pctText, final boolean folder) {
                  LinearLayout r = new LinearLayout(this);
                  r.setGravity(Gravity.CENTER_VERTICAL);
                  r.setPadding(dp(14), dp(8), dp(16), dp(4));
                  r.setBackground(ripple(false));
                  View ic = new View(this);
                  ic.setBackground(new FileIcon(folder, ext(f), dark));
                  r.addView(ic, new LinearLayout.LayoutParams(dp(38), dp(38)));
                  LinearLayout c = new LinearLayout(this);
                  c.setOrientation(LinearLayout.VERTICAL);
                  c.setPadding(dp(14), 0, dp(8), 0);
                  TextView a = text(name, 15, cText, false);
                  a.setSingleLine(true);
                  a.setEllipsize(TextUtils.TruncateAt.MIDDLE);
                  if (name.startsWith(".")) a.setAlpha(0.6f);
                  TextView b = text(sub, 12, cSub, false);
