              void onItemClick(File f) {
                  if (!selected.isEmpty()) {
                      toggleSelect(f);
                      return;
                  }
                  if (mode == M_TRASH) {
                      trashItemDialog(f);
                      return;
                  }
                  if (mode == M_SEARCH) {
                      addHistory(searchQuery);
                      hideKeyboard();
                  }
                  if (f.isDirectory()) {
                      if (mode == M_SEARCH || mode == M_LIST) saveReturn(f);
                      browse(f, null);
                      return;
                  }
                  openFile(f);
              }

              void toggleSelect(File f) {
                  if (!selected.remove(f)) selected.add(f);
                  refreshSelectionUi();
              }

              void selectAll() {
                  if (selected.size() == items.size()) selected.clear();
                  else selected.addAll(items);
                  refreshSelectionUi();
              }

              void refreshSelectionUi() {
                  adapter.notifyDataSetChanged();
                  updateHeader();
                  if (selected.isEmpty() && mode == M_HOME) btnBack.setVisibility(View.GONE);
              }

              void openFile(File f) {
                  if (!f.exists()) {
                      toast("Fichier introuvable");
                      return;
                  }
                  addRecent(f);
                  String e = ext(f);
                  if (e.equals("zip")) {
                      zipDialog(f);
                  } else if (TXT.contains(e) && f.length() < 3L * 1024 * 1024) {
                      Intent i = new Intent(this, EditorActivity.class);
                      i.putExtra("path", f.getAbsolutePath());
                      startActivity(i);
                  } else {
                      openWith(f, false);
                  }
              }

              void openWith(File f, boolean chooser) {
                  Uri u = FilesProvider.uriFor(f);
                  String mime = mimeOf(f);
                  Intent i = new Intent(Intent.ACTION_VIEW);
                  i.setDataAndType(u, mime);
                  i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_GRANT_WRITE_URI_PERMISSION);
                  try {
                      startActivity(chooser ? Intent.createChooser(i, "Ouvrir avec") : i);
                  } catch (ActivityNotFoundException ex) {
                      if (!mime.equals("*/*")) {
                          Intent j = new Intent(Intent.ACTION_VIEW);
                          j.setDataAndType(u, "*/*");
                          j.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                          try {
                              startActivity(Intent.createChooser(j, "Ouvrir avec"));
                              return;
                          } catch (Exception ignored) {
                          }
                      }
                      toast("Aucune application pour ouvrir ce fichier");
                  } catch (Exception ex) {
                      toast("Impossible d'ouvrir : " + ex.getMessage());
                  }
              }

