# Fichiers Pro 2.2 — gestionnaire de fichiers Android (APK native)
# Mettre ce fichier dans GitHub : .github/workflows/fichiers-pro.yml
# Puis : onglet Actions > "Construire Fichiers Pro" > Run workflow.
# L'APK se télécharge dans l'onglet Actions > dernier build > Artifacts.

name: Construire Fichiers Pro

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Créer le projet Android
        run: |
          mkdir -p projet && cd projet
          cat > settings.gradle << 'FIN_DU_FICHIER'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "FichiersPro"
          include ':app'
          FIN_DU_FICHIER
          cat > build.gradle << 'FIN_DU_FICHIER'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          FIN_DU_FICHIER
          cat > gradle.properties << 'FIN_DU_FICHIER'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          FIN_DU_FICHIER
          mkdir -p app
          cat > app/build.gradle << 'FIN_DU_FICHIER'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.fichierspro.app'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.fichierspro.app'
                  minSdk 26
                  targetSdk 34
                  versionCode 4
                  versionName '2.2'
              }
              signingConfigs {
                  release {
                      storeFile file('release.jks')
                      storePassword 'fichierspro'
                      keyAlias 'fp'
                      keyPassword 'fichierspro'
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }
          FIN_DU_FICHIER
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml << 'FIN_DU_FICHIER'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" tools:ignore="ScopedStorage" />
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="Fichiers Pro"
                  android:requestLegacyExternalStorage="true"
                  android:largeHeap="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".EditorActivity"
                      android:exported="false"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden"
                      android:windowSoftInputMode="adjustResize" />

                  <provider
                      android:name=".FilesProvider"
                      android:authorities="com.fichierspro.app.files"
                      android:exported="false"
                      android:grantUriPermissions="true" />
              </application>
          </manifest>
          FIN_DU_FICHIER
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/styles.xml << 'FIN_DU_FICHIER'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_bg">#14213D</color>
              <style name="AppTheme" parent="android:Theme.Material.Light.NoActionBar">
                  <item name="android:colorPrimary">#1565C0</item>
                  <item name="android:colorPrimaryDark">#0D47A1</item>
                  <item name="android:colorAccent">#1565C0</item>
              </style>
              <style name="AppDark" parent="android:Theme.Material.NoActionBar">
