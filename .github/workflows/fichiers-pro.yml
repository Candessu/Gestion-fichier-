              String optsLabel() {
                  ArrayList<String> o = new ArrayList<>();
                  if (iopts.caseSens) o.add("Aa casse");
                  if (iopts.wholeWord) o.add("mot entier");
                  if (iopts.path) o.add("chemin");
                  if (iopts.diacritics) o.add("accents");
                  if (iopts.regex) o.add("regex");
                  String[] sorts = {"", "tri : taille", "tri : date", "tri : chemin"};
                  if (iopts.sort > 0 && iopts.sort < sorts.length) o.add(sorts[iopts.sort]);
                  return TextUtils.join(" • ", o);
              }

