              void buildCrumbs() {
                  crumbs.removeAllViews();
                  File r = rootOf(currentDir);
                  ArrayList<File> chain = new ArrayList<>();
                  for (File f = currentDir; f != null; f = f.getParentFile()) {
                      chain.add(0, f);
                      if (f.equals(r)) break;
                  }
                  for (int i = 0; i < chain.size(); i++) {
                      final File f = chain.get(i);
                      boolean last = i == chain.size() - 1;
                      String name;
                      if (i == 0) name = f.equals(internalRoot()) ? "📱 Interne" : (f.getName().isEmpty() ? "/" : "💽 " + f.getName());
                      else name = f.getName();
                      TextView t = text(name, 13, last ? cPrimary : cSub, last);
                      t.setPadding(dp(8), dp(6), dp(8), dp(6));
                      t.setBackground(ripple(false));
                      t.setOnClickListener(v -> {
                          if (!f.equals(currentDir)) browse(f, null);
                      });
                      crumbs.addView(t);
                      if (!last) crumbs.addView(text("›", 15, cSub, false));
                  }
                  crumbScroll.post(() -> crumbScroll.fullScroll(View.FOCUS_RIGHT));
              }

              void loadDir(final File dir, final int keepPos, final File focus) {
                  if (dir == null) return;
                  final int gen = ++scanGen;
                  final boolean hidden = showHidden();
                  final int key = prefs.getInt("sort", 0);
                  final boolean asc = prefs.getBoolean("asc", true);
                  if (keepPos < 0) loading.setVisibility(View.VISIBLE);
                  final boolean fast = !rootOf(dir).getPath().equals("/");
                  final String dpath = dir.getAbsolutePath();
                  bg.execute(() -> {
                      final ArrayList<File> res = new ArrayList<>();
                      boolean ok = false;
                      if (fast) {
                          ArrayList<IndexWalker.Entry> es = IndexWalker.list(dpath);
                          if (es != null) {
                              ok = true;
                              for (IndexWalker.Entry e : es) {
                                  if (!hidden && e.name.startsWith(".")) continue;
                                  res.add(new IFile(IndexWalker.join(dpath, e.name), e.dir, e.size, e.mtime));
                              }
                          }
                      } else {
                          File[] fs = dir.listFiles();
                          if (fs != null) {
                              ok = true;
                              for (File f : fs) {
                                  if (!hidden && f.getName().startsWith(".")) continue;
                                  res.add(new IFile(f.getPath(), f.isDirectory(), f.length(), f.lastModified()));
                              }
                          }
                      }
                      sortFiles(res, key, asc);
                      final boolean denied = !ok;
                      ui.post(() -> {
                          if (gen != scanGen || mode != M_BROWSE) return;
                          items.clear();
                          items.addAll(res);
                          if (keepPos < 0) childCount.clear();
                          loading.setVisibility(View.GONE);
                          adapter.notifyDataSetChanged();
                          if (keepPos >= 0) listView.setSelection(Math.min(keepPos, Math.max(0, items.size() - 1)));
                          else if (focus != null) listView.setSelection(Math.max(0, items.indexOf(focus) - 2));
                          else listView.setSelection(0);
                          subText = res.size() + " élément(s)" + (denied ? " — accès refusé" : "") + "  •  " + dpath;
                          updateHeader();
                          updateEmpty();
                      });
                      final HashMap<String, Integer> cnt = new HashMap<>();
                      for (File f : res) {
                          if (gen != scanGen) return;
                          if (!f.isDirectory()) continue;
                          String[] c = f.list();
                          cnt.put(f.getAbsolutePath(), c == null ? -1 : c.length);
                      }
                      ui.post(() -> {
                          if (gen != scanGen || mode != M_BROWSE) return;
                          childCount.clear();
                          childCount.putAll(cnt);
                          adapter.notifyDataSetChanged();
                      });
                  });
              }

              static long sizeOfFile(File f) {
                  return f.isDirectory() ? 0 : f.length();
              }

              static void sortFiles(List<File> list, final int key, final boolean asc) {
                  final HashMap<File, Boolean> isDir = new HashMap<>();
                  for (File f : list) isDir.put(f, f.isDirectory());
                  Collections.sort(list, (a, b) -> {
                      boolean da = isDir.get(a), db = isDir.get(b);
                      if (da != db) return da ? -1 : 1;
                      int r;
                      switch (key) {
                          case 1:
                              r = Long.compare(sizeOfFile(a), sizeOfFile(b));
                              break;
                          case 2:
                              r = Long.compare(a.lastModified(), b.lastModified());
                              break;
                          case 3:
                              r = ext(a).compareTo(ext(b));
                              if (r == 0) r = a.getName().compareToIgnoreCase(b.getName());
                              break;
                          default:
                              r = a.getName().compareToIgnoreCase(b.getName());
                      }
                      return asc ? r : -r;
                  });
              }

              // ---------------------------------------------------------------- index : catégories instantanées

              void ensureIndex() {
                  if (index != null) return;
                  index = FileIndex.get(this);
                  index.listener = indexListener;
                  index.requestSync(false);
              }

              void onIndexChanged() {
                  if (isFinishing() || index == null) return;
                  if (mode == M_HOME) {
                      updateTileStats();
                  } else if (mode == M_ANALYSIS) {
                      if (!index.syncing || SystemClock.uptimeMillis() - anaLastLoad > 4000) refresh();
                  } else if (mode == M_LIST) {
                      if (selected.isEmpty()) loadList(true);
                  } else if (mode == M_SEARCH) {
                      if (selected.isEmpty() && (instantMode || !searchQuery.isEmpty()) && index.version.get() != searchVer
                              && (!index.syncing || items.isEmpty())) {
                          runSearch();
                          softGen = searchGen.get();
                      }
                  }
              }

              static String fmtCount(long n) {
                  return String.format(Locale.FRANCE, "%,d", n);
              }

              int hi() {
                  return dark ? 0xFF90CAF9 : cPrimary;
              }

              void updateTileStats() {
                  if (index == null || tileCounts == null) return;
                  final TextView[] tc = tileCounts;
                  final boolean hidden = showHidden();
                  bg.execute(() -> {
                      final long[][] st = index.allStats(hidden);
                      ui.post(() -> {
                          if (mode != M_HOME || tc != tileCounts) return;
                          for (int i = 0; i < 6; i++) tc[i].setText(tileText(st[i + 1]));
                          tc[7].setText(tileText(st[0]));
                      });
                  });
              }

              String tileText(long[] st) {
                  if (st[0] == 0) return index.syncing ? "…" : "0";
                  return fmtCount(st[0]) + " • " + fmtSize(st[1]);
              }

              void showCategory(String title, int kind) {
                  showCategoryIn(title, kind, null);
              }

              void showCategoryIn(String title, int kind, String scope) {
                  ensureIndex();
                  back = null;
                  listBack = null;
                  listScope = scope;
                  mode = M_LIST;
                  listKind = kind;
                  selected.clear();
                  subText = "";
                  showListUi(title, false, false);
                  loadList(false);
              }

              /**
               * Lit la catégorie dans l'index : la première page s'affiche tout de suite,
               * le reste est ajouté juste après. keepPos = rechargement discret (position conservée).
               */
              void loadList(final boolean keepPos) {
                  final int gen = ++scanGen;
                  final int kind = listKind;
                  final String scope = listScope;
                  final boolean hidden = showHidden();
                  final int pos = listView.getFirstVisiblePosition();
                  View v0 = listView.getChildAt(0);
                  final int top = v0 == null ? 0 : v0.getTop() - listView.getPaddingTop();
                  final int cap = kind == FileIndex.BIG ? 500 : -1;
                  bg.execute(() -> {
                      final ArrayList<IFile> first = index.list(kind, hidden, keepPos ? cap : 300, 0, scope);
                      final long[] st = index.stats(kind, hidden, scope);
                      ui.post(() -> {
                          if (gen != scanGen || mode != M_LIST) return;
                          if (keepPos && !selected.isEmpty()) return;
                          items.clear();
                          items.addAll(first);
                          boolean wait = items.isEmpty() && index.syncing;
                          loading.setVisibility(wait ? View.VISIBLE : View.GONE);
                          adapter.notifyDataSetChanged();
                          if (keepPos) listView.setSelectionFromTop(Math.min(pos, Math.max(0, items.size() - 1)), top);
                          else listView.setSelection(0);
                          if (wait) subText = "Indexation en cours…";
                          else subText = (kind == FileIndex.BIG && st[0] > 500 ? "500 plus gros sur " + fmtCount(st[0])
                                  : fmtCount(st[0]) + " élément(s)") + "  •  " + fmtSize(st[1])
                                  + (index.syncing ? "  •  mise à jour…" : "");
                          updateHeader();
                          updateEmpty();
                      });
                      if (!keepPos && first.size() == 300) {
                          final ArrayList<IFile> rest = index.list(kind, hidden, kind == FileIndex.BIG ? 200 : -1, 300, scope);
                          ui.post(() -> {
                              if (gen != scanGen || mode != M_LIST || rest.isEmpty()) return;
                              items.addAll(rest);
                              adapter.notifyDataSetChanged();
                          });
                      }
                  });
              }

              // ---------------------------------------------------------------- recherche en temps réel

              void hideKeyboard() {
                  InputMethodManager im = (InputMethodManager) getSystemService(Context.INPUT_METHOD_SERVICE);
                  if (im != null && searchEdit != null) im.hideSoftInputFromWindow(searchEdit.getWindowToken(), 0);
              }

              List<String> searchHistory() {
                  ArrayList<String> out = new ArrayList<>();
                  for (String x : prefs.getString("sh", "").split("\n")) if (!x.isEmpty()) out.add(x);
                  return out;
              }

              void addHistory(String q) {
                  if (q == null || q.trim().isEmpty()) return;
                  q = q.trim();
                  List<String> h = searchHistory();
                  Iterator<String> it = h.iterator();
                  while (it.hasNext()) if (it.next().equalsIgnoreCase(q)) it.remove();
                  h.add(0, q);
                  while (h.size() > 8) h.remove(h.size() - 1);
                  prefs.edit().putString("sh", TextUtils.join("\n", h)).apply();
              }

              void openSearch() {
                  ensureIndex();
                  back = null;
                  listBack = null;
                  searchHome = mode == M_BROWSE ? currentDir : null;
                  searchScope = searchHome;
                  prevDir = searchHome;
                  mode = M_SEARCH;
                  selected.clear();
                  scanGen++;
                  searchQuery = "";
                  searchStatus = "";
                  showListUi("Recherche", true, false);
                  loading.setVisibility(View.GONE);
                  content.addView(historyView, new FrameLayout.LayoutParams(-1, -1));
                  suppressWatcher = true;
                  searchEdit.setText("");
                  suppressWatcher = false;
                  buildTypeChips();
                  buildSearchStatus();
                  if (instantMode) runSearch();
                  else showHistory();
                  updateHeader();
                  searchEdit.requestFocus();
                  searchEdit.post(() -> {
                      InputMethodManager im = (InputMethodManager) getSystemService(Context.INPUT_METHOD_SERVICE);
                      if (im != null && mode == M_SEARCH) im.showSoftInput(searchEdit, InputMethodManager.SHOW_IMPLICIT);
                  });
                  final FileIndex ix = index;
                  if (instantMode) ix.wantByName = true;
                  searchExec.execute(() -> {
                      SearchEngine.Snapshot sn = ix.snapshot();
                      if (instantMode) InstantSearch.byName(sn);
                  });
              }

              void buildSearchStatus() {
                  crumbs.removeAllViews();
                  LinearLayout seg = new LinearLayout(this);
                  seg.setOrientation(LinearLayout.HORIZONTAL);
                  seg.setBackground(round(soft(cPrimary), 16));
                  seg.setPadding(dp(2), dp(2), dp(2), dp(2));
                  String[][] modes = {{"🌐 Globale", "0"}, {"⚡ Instantanée", "1"}};
                  for (final String[] md : modes) {
                      final boolean inst = md[1].equals("1");
                      boolean on = inst == instantMode;
                      TextView t = text(md[0], 12, on ? Color.WHITE : hi(), true);
