                               final boolean full, int threads, Sink sink, final AtomicBoolean cancel) {
                  final ConcurrentLinkedDeque<Task> queue = new ConcurrentLinkedDeque<>();
                  final AtomicInteger pending = new AtomicInteger();
                  final LinkedBlockingQueue<DirResult> out = new LinkedBlockingQueue<>(256);
                  for (String r : roots) {
