              void runSearch() {
                  if (mode != M_SEARCH || index == null) return;
                  if (instantMode) {
                      runInstant();
                      return;
                  }
                  final String q = searchEdit.getText().toString().trim();
                  searchQuery = q;
                  final int g = searchGen.incrementAndGet();
                  if (q.isEmpty()) {
                      items.clear();
                      adapter.notifyDataSetChanged();
                      searchStatus = "";
                      buildSearchStatus();
                      emptyView.setVisibility(View.GONE);
                      showHistory();
                      return;
                  }
                  historyView.setVisibility(View.GONE);
                  final String scope = searchScope == null ? null : searchScope.getAbsolutePath();
                  final boolean hidden = showHidden();
                  final FileIndex ix = index;
                  searchExec.execute(() -> {
                      if (searchGen.get() != g) return;
                      long t0 = SystemClock.uptimeMillis();
                      SearchEngine.Snapshot sn = ix.snapshotFast();
                      SearchEngine.Result r = SearchEngine.search(sn, q, scope, hidden, 300, false, searchGen, g);
                      if (r == null) return;
                      if (r.total > 0) publishSearch(sn, r, g, t0);
                      if (r.total < 25) {
                          SearchEngine.Result r2 = SearchEngine.search(sn, q, scope, hidden, 300, true, searchGen, g);
                          if (r2 == null) return;
                          if (r2.total > r.total || r.total == 0) publishSearch(sn, r2, g, t0);
                      }
                  });
              }

              void publishSearch(SearchEngine.Snapshot sn, final SearchEngine.Result r, final int g, long t0) {
                  final ArrayList<File> list = new ArrayList<>(r.idx.length);
                  for (int i : r.idx)
                      list.add(new IFile(sn.path(i), (sn.flags[i] & SearchEngine.F_DIR) != 0, sn.size[i], sn.mtime[i]));
                  final long ms = SystemClock.uptimeMillis() - t0;
                  final long ver = sn.version;
                  ui.post(() -> {
                      if (searchGen.get() != g || mode != M_SEARCH || !selected.isEmpty() || instantMode) return;
                      searchVer = ver;
                      int keepPos = listView.getFirstVisiblePosition();
                      View k0 = listView.getChildAt(0);
                      int keepTop = k0 == null ? 0 : k0.getTop() - listView.getPaddingTop();
                      items.clear();
                      items.addAll(list);
                      adapter.notifyDataSetChanged();
                      if (softGen == g) listView.setSelectionFromTop(Math.min(keepPos, Math.max(0, items.size() - 1)), keepTop);
                      else listView.setSelection(0);
                      searchStatus = fmtCount(r.total) + " résultat(s)"
                              + (r.total > r.idx.length ? " — " + r.idx.length + " meilleurs affichés" : "")
                              + (r.fuzzy ? "  •  approchants inclus" : "") + "  •  " + ms + " ms";
                      buildSearchStatus();
                      updateEmpty();
                  });
              }

              CharSequence highlighted(String name) {
                  if (searchQuery.isEmpty()) return name;
                  String hq = searchQuery;
                  if (instantMode) {
                      if (iopts.regex) return name;
                      StringBuilder b = new StringBuilder();
                      for (String t : hq.replace("\"", " ").split("\\s+")) {
                          if (t.isEmpty() || t.startsWith("!")) continue;
                          String first = t.split("\\|")[0].replace("*", " ").replace("?", " ").trim();
                          if (!first.isEmpty()) b.append(first).append(' ');
                      }
                      hq = b.toString().trim();
                      if (hq.isEmpty()) return name;
                  }
                  int[] h = SearchEngine.highlight(name, hq);
                  if (h == null) return name;
                  SpannableString sp = new SpannableString(name);
                  sp.setSpan(new ForegroundColorSpan(hi()), h[0], h[1], Spanned.SPAN_EXCLUSIVE_EXCLUSIVE);
                  sp.setSpan(new StyleSpan(Typeface.BOLD), h[0], h[1], Spanned.SPAN_EXCLUSIVE_EXCLUSIVE);
                  return sp;
              }

              void showTrash() {
                  back = null;
                  listBack = null;
                  mode = M_TRASH;
                  selected.clear();
                  subText = "Appuyez sur un élément pour le restaurer";
                  showListUi("Corbeille", false, false);
                  final int gen = ++scanGen;
                  bg.execute(() -> {
                      File[] fs = trashDir().listFiles();
                      final ArrayList<File> res = new ArrayList<>();
                      if (fs != null) res.addAll(Arrays.asList(fs));
                      Collections.sort(res, (a, b) -> b.getName().compareTo(a.getName()));
                      long tot = 0;
                      for (File f : res) tot += sizeRec(f);
                      final long ftot = tot;
                      ui.post(() -> {
                          if (gen != scanGen) return;
                          items.clear();
                          items.addAll(res);
                          loading.setVisibility(View.GONE);
                          adapter.notifyDataSetChanged();
                          subText = res.size() + " élément(s)  •  " + fmtSize(ftot);
                          updateHeader();
                          updateEmpty();
                      });
                  });
              }

              void refresh() {
                  switch (mode) {
                      case M_BROWSE:
                          loadDir(currentDir, listView.getFirstVisiblePosition(), null);
                          break;
                      case M_TRASH:
                          showTrash();
                          break;
                      case M_LIST:
                      case M_SEARCH:
                          adapter.notifyDataSetChanged();
                          updateHeader();
                          updateEmpty();
                          break;
                      case M_HOME:
                          showHome();
                          break;
                      case M_ANALYSIS:
                          loadAnalysis(anaScroll != null ? anaScroll.getScrollY() : 0);
                          break;
                  }
              }

